    // Mock-mode port of backend/engine/code_hints.py: inspects the typed code and returns findings (most important
    // first), each a 3-layer ladder (Nudge / Pointer / Approach). The real backend parses Python properly with `ast`;
    // this is a close regex approximation so the standalone preview behaves the same way.
    const PY_KEYWORDS = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case".split(" "));
    const PY_BUILTINS = new Set("abs aiter all anext any ascii bin bool breakpoint bytearray bytes callable chr classmethod compile complex copyright credits delattr dict dir divmod enumerate eval exec exit filter float format frozenset getattr globals hasattr hash help hex id input int isinstance issubclass iter len license list locals map max memoryview min next object oct open ord pow print property quit range repr reversed round set setattr slice sorted staticmethod str sum super tuple type vars zip __name__ __file__ __doc__ self cls Exception ValueError TypeError KeyError IndexError NameError RuntimeError StopIteration ZeroDivisionError AttributeError ImportError OSError ArithmeticError AssertionError NotImplemented Ellipsis BaseException KeyboardInterrupt".split(" "));
    const PY_SHADOW = new Set("sum max min len list dict set str int float sorted input print type id all any map filter range abs round zip next iter format hash object open bool tuple reversed enumerate".split(" "));

    function mockCodeFindings(code, challengeId) {
      const FN = { "last-k-total": ["last_k_total", ["marks", "k"]] }[challengeId];
      const sigAny = code.match(/def\s+([A-Za-z_]\w*)\s*\(([^)]*)\)/);
      const fname = FN ? FN[0] : (sigAny ? sigAny[1] : "your function");
      const L = (kind, n, p, a) => ({ kind, ladder: [n, p, a] });
      const out = [];
      const DQ3 = '"'.repeat(3), SQ3 = "'".repeat(3);
      const strRe = new RegExp("(" + DQ3 + "[\\s\\S]*?" + DQ3 + "|" + SQ3 + "[\\s\\S]*?" + SQ3 + "|\"(?:\\\\.|[^\"\\\\\\n])*\"|'(?:\\\\.|[^'\\\\\\n])*')", "g");
      const stripStr = (t) => t.replace(strRe, (m) => '"' + " ".repeat(Math.max(0, m.length - 2)) + '"').replace(/\b[rbfuRBFU]{1,2}(?=")/g, "");
      const clean = stripStr(code).replace(/#.*$/gm, "");
      const cleanLines = clean.split("\n");
      if (!clean.trim()) return [L("empty_editor", "What does the problem ask your function to hand back, and what does it receive?", "The editor is empty, so there is nothing to check yet. A function needs a name, its inputs and a result.", `Start by writing the function ${fname} with the inputs from the problem, say in words how you would get the answer by hand, then turn each step into a line.`)];

      // 1. syntax problems
      const KW_LEAD = /^(def|class|if|elif|else|for|while|try|except|finally|with|return|import|from|pass|break|continue|raise|assert|del|global|nonlocal|lambda|yield|print|not|and|or|in|is|async|await|match|case)$/;
      let synLine = 0, why = "";
      const stack = []; const pair = { ")": "(", "]": "[", "}": "{" };
      for (let i = 0; i < cleanLines.length && !synLine; i++) {
        const t = cleanLines[i];
        if (!t.trim()) continue;
        const open = stack.length > 0;
        if (!open && /^\s*(def|class|if|elif|else|for|while|try|except|finally|with)\b/.test(t) && !/:\s*$/.test(t) && !/:\s*\S/.test(t)) { synLine = i + 1; why = "expected ':'"; break; }

        if (!open && m && !KW_LEAD.test(m[1]) && !KW_LEAD.test(m[2])) { synLine = i + 1; why = "invalid syntax"; break; }
        for (const ch of t) {
          if ("([{".includes(ch)) stack.push([ch, i + 1]);
          else if (")]}".includes(ch)) { const top = stack.pop(); if (!top || top[0] !== pair[ch]) { synLine = i + 1; why = "unmatched bracket"; break; } }
        }
      }
      if (!synLine && stack.length) { synLine = stack[stack.length - 1][1]; why = "unclosed bracket"; }
      if (synLine) return [L("syntax_error", "Python reads your file from top to bottom. Where could it get confused about what you meant?", `Python cannot even read your code: it stopped around line ${synLine} (${why}). The real slip is often on that line or the one just before it.`, "Check that every opening bracket or quote is closed, every if/for/def line ends with a colon, there are no two words side by side, and the indentation is consistent. Fix the first problem Python reports, then try again.")];

      // 2. general problems (any Python code): names used but never created, built-ins hidden by variables
      const bound = new Set(); let star = false;
      const addNames = (txt) => (txt.match(/[A-Za-z_]\w*/g) || []).forEach((n) => { if (!PY_KEYWORDS.has(n)) bound.add(n); });
      for (const line of cleanLines) {
        let m;
        if ((m = line.match(/^\s*(?:async\s+)?def\s+(\w+)\s*\(([^)]*)\)/))) { bound.add(m[1]); m[2].split(",").forEach((x) => addNames(x.split(/[=:]/)[0])); }
        if ((m = line.match(/^\s*class\s+(\w+)/))) bound.add(m[1]);
        const imp = line.match(/^\s*(?:from\s+[\w.]+\s+)?import\s+(.+)$/);
        if (imp) { if (/\*/.test(imp[1])) star = true; imp[1].split(",").forEach((part) => { const mm = part.trim().split(/\s+as\s+/); addNames((mm[1] || mm[0]).split(".")[0]); }); }
        for (const f of line.matchAll(/\bfor\s+([^:]+?)\s+in\b/g)) addNames(f[1]);
        for (const w of line.matchAll(/\bas\s+([A-Za-z_]\w*)/g)) bound.add(w[1]);
        for (const lam of line.matchAll(/\blambda\s*([^:]*):/g)) addNames(lam[1].replace(/=[^,]*/g, ""));
        for (const wal of line.matchAll(/([A-Za-z_]\w*)\s*:=/g)) bound.add(wal[1]);
        if ((m = line.match(/^\s*(?:global|nonlocal)\s+(.+)$/))) addNames(m[1]);
        // assignment targets: everything left of a plain/augmented "=" (not ==, <=, >=, !=), at statement level
        if (!/^\s*(?:def|class|if|elif|while|return|assert|print)\b/.test(line)) {
          const eq = line.search(/(?:\*\*|\/\/|>>|<<|[-+*\/%&|^@])?=(?!=)/);
          if (eq > 0 && !/[<>!=]$/.test(line.slice(0, eq).trimEnd())) {
            line.slice(0, eq).split(/=(?!=)/).forEach((seg) => seg.replace(/\[[^\]]*\]/g, "").replace(/\.\w+/g, "").replace(/[A-Za-z_]\w*\s*\(/g, "").split(/[,\s()*]+/).forEach((tok) => { if (/^[A-Za-z_]\w*$/.test(tok) && !PY_KEYWORDS.has(tok)) bound.add(tok); }));
          }
        }
      }
      const known = (n) => bound.has(n) || PY_BUILTINS.has(n) || PY_KEYWORDS.has(n);

        let first = null;

        }
        if (first) {
          const pool = [...bound, ...PY_BUILTINS].filter((k) => !k.startsWith("__"));

      }
      for (let i = 0; i < cleanLines.length; i++) {
        const m = cleanLines[i].match(/^\s*([A-Za-z_]\w*)\s*(?:[-+*\/%]|\/\/|\*\*)?=(?!=)/);
        if (m && PY_SHADOW.has(m[1])) { out.push(L("shadowed_builtin", "Python already gives you some ready-made tools with simple names. Could one of your variable names collide with one of them?", `On line ${i + 1} you create a variable called ${m[1]}, which hides Python's own ${m[1]} from then on.`, "Give that variable a more descriptive name that says what it holds, so the built-in tool stays available.")); break; }
      }

      // 3. challenge-specific problems
      const def = clean.match(new RegExp("def\\s+" + fname + "\\s*\\(([^)]*)\\)\\s*:"));
      const params = FN ? FN[1] : (sigAny ? sigAny[2].split(",").map((x) => x.trim().split(/[=:]/)[0].trim()).filter(Boolean) : []);
      if (FN && !def) { out.push(L("missing_function", "How does the checker know which of your functions to call?", `Nothing in your code is named ${fname}. The checker looks for exactly that name.`, `Define a function named ${fname} that takes ${params.join(", ")} and keep your logic inside it.`)); return out; }
      if (!def) return out;
      const body = clean.slice(clean.indexOf(def[0]) + def[0].length);
      const real = body.split("\n").filter((l) => l.trim() && !/^\s*(pass|\.\.\.|["'].*["'])\s*$/.test(l));
      if (real.length === 0) { out.push(L("placeholder_body", "If you ran the function right now, what would it hand back?", `${fname} does not compute anything yet: its body is only a placeholder. Nothing is being returned.`, "Say in plain words how you would get the answer by hand for one example, then write one line per step and finish by giving the result back to the caller.")); return out; }
      if (!/\breturn\s+\S/.test(body)) {
        if (/\bprint\s*\(/.test(body)) out.push(L("print_without_return", "How does the code that calls your function get the answer back from it?", "Your function shows a result on the screen, but nothing is handed back to the caller, so the caller receives nothing.", "Keep the calculation, but give the finished answer back to the caller instead of only displaying it."));
        else out.push(L("no_return", "When your function reaches its last line, what does the caller get?", `${fname} never hands a value back, so the caller always receives nothing.`, "Work out the final answer in a variable, then end the function by giving that value back."));
      }
      const unused = params.filter((pn) => !new RegExp("\\b" + pn + "\\b").test(body));
      if (unused.length) out.push(L("unused_input", "Does the answer depend on every piece of information the function is given?", `The input(s) ${unused.join(", ")} are never used in your logic, so the result cannot depend on them.`, "Decide how each input should influence the answer, then use it in the calculation."));
      if (params.some((pn) => new RegExp("\\b" + pn + "\\.(append|extend|insert|pop|remove|sort|reverse|clear)\\(|\\b" + pn + "\\[[^\\]]*\\]\\s*[+\\-*]?=(?!=)").test(body))) out.push(L("mutates_input", "Who else might be holding on to the data you were given, and what happens if you change it?", "Your code changes the caller's own data instead of working on a copy.", "Leave the input untouched: build a new value for your answer, or work on a copy of the input."));
      const neg = body.match(/\[\s*-\s*([A-Za-z_]\w*)\s*:\s*\]/);
      if (neg && params.includes(neg[1]) && !new RegExp("[<>=!]=?\\s*" + neg[1] + "\\b|\\b" + neg[1] + "\\s*[<>=!]").test(body)) out.push(L("negative_slice_unguarded", "What does counting backwards from the end do when the count is 0, or larger than the list?", `You slice from the end using -${neg[1]} with no check on its value. Zero and oversized counts behave surprisingly with negative positions.`, "Handle the zero case and the 'count is bigger than the list' case on their own before slicing, or compute a start position that can never go below the first item."));
      if (/while\s+True\s*:/.test(body) && !/\b(break|return)\b/.test(body)) out.push(L("endless_loop", "What has to happen inside your loop for it to ever stop?", "Your loop has no way out, so it keeps running forever and the test times out.", "Give the loop an exit: change something each pass until a stopping condition becomes true, or leave it with an explicit break or return when you are done."));
      return out;
    }

    // The bearer token lives in sessionStorage (per tab, cleared when the tab closes). PINs and
    // one-time codes are never stored. Learners without a PIN/identity keep working as guests.
    const SESSION_KEY = "debugdojo_session";

    const Session = {

      load() {
        try {
          const v = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null");
          return v && v.learnerId && v.token ? v : null;
        } catch (e) { return null; }
      },
      save(s) {
        Session.current = s;
        try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch (e) {}
      },
      clear() {
        Session.current = null;
        try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
      },
    };

    function authHeaders(extra = {}) {

    // Turn a non-2xx response into an ApiError carrying the backend's {"error": "..."} message.
    async function ensureOk(res, fallback) {
      if (res.ok) return res;
      const body = await res.json().catch(() => ({}));
      const detail = body.error || body.detail;
      throw new ApiError(typeof detail === "string" ? detail : `${fallback} (${res.status})`, res.status);
    }

          return {

    // --- CONTEXT (Learner identity in React state, theme in React state) ---

    // in assets/sakura.css, so every illustration re-themes for day/night)
    // ======================================================================

    // Small seeded PRNG so generated blossoms are identical on every render.
    function mulberry32(seed) {
      let a = seed;
      return function () {
        a |= 0; a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // Point on a cubic bezier given as [x0,y0,c1x,c1y,c2x,c2y,x1,y1]
    function bezierPoint(p, t) {
      const u = 1 - t;
      return [
        u * u * u * p[0] + 3 * u * u * t * p[2] + 3 * u * t * t * p[4] + t * t * t * p[6],
        u * u * u * p[1] + 3 * u * u * t * p[3] + 3 * u * t * t * p[5] + t * t * t * p[7],
      ];
    }

    // <BlossomDefs>: one reusable five-petal blossom + gradient (referenced with <use>)
    function BlossomDefs({ idp }) {
      const stamens = [0, 1, 2, 3, 4, 5, 6].map((i) => {
        const a = (i / 7) * Math.PI * 2;
        return [Math.cos(a) * 5.5, Math.sin(a) * 5.5];

      return (
        <defs>
          <radialGradient id={`${idp}-g`} cx="0" cy="0" r="17" gradientUnits="userSpaceOnUse">
            <stop offset="0" style={{ stopColor: "var(--petal-core)" }} />

            <stop offset="1" style={{ stopColor: "var(--petal-1)" }} />

          <g id={`${idp}-b`}>
            {[0, 72, 144, 216, 288].map((a) => (
              <path
                key={a}
                transform={`rotate(${a})`}
                d="M0 0C-7 -3 -9.5 -13 -2.6 -16.5L0 -14.2L2.6 -16.5C9.5 -13 7 -3 0 0Z"
                fill={`url(#${idp}-g)`}
              />

            {stamens.map(([x, y], i) => (
              <g key={i}>
                <line x1="0" y1="0" x2={x} y2={y} stroke="var(--petal-core)" strokeWidth="0.6" />

            <circle r="2" fill="var(--petal-core)" />
          </g>
        </defs>
      );
    }

    // <BranchGroup>: brown bezier branches studded with blossoms and buds
    function BranchGroup({ paths, seed = 7, idp, density = 1 }) {
      const items = useMemo(() => {
        const rand = mulberry32(seed);
        const out = [];
        paths.forEach(({ p, w }) => {
          const count = Math.round((w * 2.4 + 3) * density);
          for (let i = 0; i < count; i++) {
            const t = 0.12 + (i / count) * 0.88 + (rand() - 0.5) * 0.06;
            const [x, y] = bezierPoint(p, Math.min(t, 1));
            const off = (rand() - 0.5) * 30;
            out.push({
              x: x + off * 0.7,
              y: y + off,
              r: Math.round(rand() * 360),
              s: 0.55 + rand() * 0.8,
              o: 0.72 + rand() * 0.28,
              bud: rand() < 0.14,
            });
          }
          // a cluster at every branch tip
          const [tx, ty] = bezierPoint(p, 1);
          for (let k = 0; k < 3; k++) {
            out.push({ x: tx + (rand() - 0.5) * 22, y: ty + (rand() - 0.5) * 22, r: Math.round(rand() * 360), s: 0.7 + rand() * 0.6, o: 1, bud: false });
          }
        });
        return out;
      }, [paths, seed, density]);

      return (
        <g>
          {paths.map(({ p, w }, i) => (
            <path
              key={i}
              d={`M${p[0]} ${p[1]}C${p[2]} ${p[3]} ${p[4]} ${p[5]} ${p[6]} ${p[7]}`}
              fill="none"
              stroke="var(--branch)"
              strokeWidth={w}
              strokeLinecap="round"
            />
          ))}
          {items.map((it, i) =>
            it.bud ? (
              <ellipse key={i} cx={it.x} cy={it.y} rx={3.4 * it.s} ry={4.6 * it.s} fill="var(--petal-2)" transform={`rotate(${it.r} ${it.x} ${it.y})`} />
            ) : (
              <use key={i} href={`#${idp}-b`} transform={`translate(${it.x} ${it.y}) rotate(${it.r}) scale(${it.s})`} opacity={it.o} />
            )
          )}
        </g>
      );
    }

    // <SakuraBranch>: a blossoming branch that reaches in from a top corner
    function SakuraBranch({ seed = 11, idp = "br" }) {
      return (
        <svg viewBox="0 0 520 340" aria-hidden="true" focusable="false">
          <BlossomDefs idp={idp} />
          <BranchGroup paths={BRANCH_PATHS} seed={seed} idp={idp} />

    // <Lantern>: paper chochin lantern with a kanji, swaying gently and glowing amber
    function Lantern({ char = "道", size = 44, delay = 0, hang = 26 }) {
      const w = size;
      const h = Math.round(size * 1.32);
      return (
        <div className="lantern" style={{ animationDelay: `${delay}s` }} aria-hidden="true">
          <svg width={w} height={h + hang + 14} viewBox={`0 0 ${w} ${h + hang + 14}`}>
            <defs>
              <radialGradient id={`lg-${char}-${size}`} cx="50%" cy="45%" r="60%">
                <stop offset="0" stopColor="#ffe9a8" />
                <stop offset="0.55" stopColor="#ffb547" />
                <stop offset="1" stopColor="#e2701f" />
              </radialGradient>
            </defs>

    // <CountUp>: Big serif numerals for stats
    function CountUp({ value, label, suffix = "" }) {
      const [count, setCount] = useState(0);

      useEffect(() => {
        let start = 0;
        const target = typeof value === 'number' ? value : parseInt(value, 10) || 0;
        if (target === 0) {
          setCount(0);
          return;
        }
        const duration = 650;
        const stepTime = 30;
        const totalSteps = duration / stepTime;
        const increment = target / totalSteps;

        const timer = setInterval(() => {
          start += increment;
          if (start >= target) {
            setCount(target);
            clearInterval(timer);
          } else {
            setCount(Math.floor(start));
          }
        }, stepTime);

        return () => clearInterval(timer);
      }, [value]);

      return (
        <div className="flex flex-col">
          <span className="font-serif text-4xl md:text-5xl font-bold text-ink tracking-tight leading-none">
            {count}{suffix}
          </span>
          {label && (
            <span className="text-[11px] uppercase tracking-[0.12em] font-mono text-ink-soft mt-2">
              {label}
            </span>
          )}
        </div>
      );
    }

    // <Reveal>: scroll-triggered entrance — children rise in when they enter the viewport, offset by `delay` ms
    function Reveal({ children, delay = 0, className = "" }) {
      const ref = useRef(null);
      const [shown, setShown] = useState(false);
      useEffect(() => {
        const el = ref.current;
        const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!el || reduced || !("IntersectionObserver" in window)) { setShown(true); return; }
        const io = new IntersectionObserver(
          (entries) => { if (entries.some((e) => e.isIntersecting)) { setShown(true); io.disconnect(); } },
          { threshold: 0.1, rootMargin: "0px 0px -6% 0px" }
        );
        io.observe(el);
        return () => io.disconnect();
      }, []);
      return (
        <div ref={ref} className={`reveal ${shown ? "in-view" : ""} ${className}`} style={{ "--d": `${delay}ms` }}>
          {children}
        </div>
      );
    }

    // <CodeMirrorEditor>: CodeMirror 5 with Python mode, 4-space indent, fallback to textarea
    function CodeMirrorEditor({ value, onChange, onRun, onSubmit, onEsc, readOnly = false, refreshKey = null }) {
      const containerRef = useRef(null);
      const cmRef = useRef(null);
      const [hasCM, setHasCM] = useState(true);

      const onRunRef = useRef(onRun);
      const onSubmitRef = useRef(onSubmit);
      const onChangeRef = useRef(onChange);
      const onEscRef = useRef(onEsc);

      useEffect(() => { onRunRef.current = onRun; }, [onRun]);
      useEffect(() => { onSubmitRef.current = onSubmit; }, [onSubmit]);
      useEffect(() => { onChangeRef.current = onChange; }, [onChange]);
      useEffect(() => { onEscRef.current = onEsc; }, [onEsc]);

      useEffect(() => {
        if (!window.CodeMirror || !containerRef.current) {
          setHasCM(false);
          return;
        }

        try {
          const extraKeys = {
            "Tab": function(cm) {
              if (cm.somethingSelected()) {
                cm.indentSelection("add");
              } else {
                cm.replaceSelection("    ", "end");
              }
            },
            "Esc": function(cm) {
              if (onEscRef.current) {
                onEscRef.current();
              } else {
                cm.display.input.blur();
              }
            },
            "Ctrl-Enter": function() {
              if (onRunRef.current) onRunRef.current();
            },
            "Cmd-Enter": function() {
              if (onRunRef.current) onRunRef.current();
            },
            "Ctrl-Shift-Enter": function() {
              if (onSubmitRef.current) onSubmitRef.current();
            },
            "Cmd-Shift-Enter": function() {
              if (onSubmitRef.current) onSubmitRef.current();
            }
          };

          const cm = window.CodeMirror(containerRef.current, {
            value: value || "",
            mode: "python",
            lineNumbers: true,
            tabSize: 4,
            indentUnit: 4,
            indentWithTabs: false,
            readOnly: readOnly,
            lineWrapping: true,
            extraKeys: extraKeys
          });

          cm.on("change", (instance, changeObj) => {
            if (changeObj.origin !== "setValue") {
              const val = instance.getValue();
              if (onChangeRef.current) {
                onChangeRef.current(val);
              }
            }
          });

          cmRef.current = cm;

          setTimeout(() => {
            if (cmRef.current) cmRef.current.refresh();
          }, 50);

          return () => {
            const wrapper = cm.getWrapperElement();
            if (wrapper && wrapper.parentNode) {
              wrapper.parentNode.removeChild(wrapper);
            }
            cmRef.current = null;
          };
        } catch (e) {
          console.warn("CodeMirror init failed, falling back to textarea", e);
          setHasCM(false);
        }
      }, []);

      useEffect(() => {
        if (cmRef.current && value !== cmRef.current.getValue()) {
          const cursor = cmRef.current.getCursor();
          cmRef.current.setValue(value || "");
          try {
            cmRef.current.setCursor(cursor);
          } catch (_) {}
        }
      }, [value]);

      useEffect(() => {
        if (cmRef.current) {
          cmRef.current.setOption("readOnly", readOnly);
          cmRef.current.refresh();
        }
      }, [readOnly]);

      useEffect(() => {
        if (cmRef.current) {
          cmRef.current.refresh();
        }
      }, [refreshKey]);

      if (!hasCM) {
        return (
          <textarea
            value={value}
            onChange={(e) => onChange && onChange(e.target.value)}
            readOnly={readOnly}
            rows={readOnly ? 8 : 12}
            className="code-area"
            spellCheck="false"
            aria-label="Python code editor"
          />
        );
      }

      return (
        <div
          ref={containerRef}
          className="cm-host w-full"
          style={{ minHeight: readOnly ? "180px" : "260px" }}
        />
      );
    }

    // ======================================================================
    // ATMOSPHERE, MOTION & INTERACTION
    // ======================================================================
    const AMBIENCE_KEY = "debugdojo_ambience";
    const AMBIENCE_DEFAULT = { density: 70, speed: 100, trail: true };

    function usePrefersReducedMotion() {
      return useMemo(
        () => typeof window !== "undefined" && !!window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches,
        []
      );
    }

    // Writes --scroll-y / --scroll-p on <html> so CSS can drive parallax, the progress bar and header state.
    function useScrollEffects() {
      useEffect(() => {
        const root = document.documentElement;
        let raf = 0;
        const update = () => {
          raf = 0;
          const y = window.scrollY || 0;
          const max = Math.max(1, root.scrollHeight - window.innerHeight);
          root.style.setProperty("--scroll-y", String(Math.round(y)));
          root.style.setProperty("--scroll-p", Math.min(1, y / max).toFixed(4));
          root.dataset.scrolled = y > 12 ? "1" : "0";
        };
        const onScroll = () => { if (!raf) raf = requestAnimationFrame(update); };
        update();
        window.addEventListener("scroll", onScroll, { passive: true });
        window.addEventListener("resize", onScroll);
        return () => {
          window.removeEventListener("scroll", onScroll);
          window.removeEventListener("resize", onScroll);
          if (raf) cancelAnimationFrame(raf);
        };
      }, []);
    }

    // Pointer effects (fine pointers only): card spotlight + tilt, magnetic primary buttons, background parallax.
    function useMouseEffects(enabled) {
      useEffect(() => {
        if (!enabled || !window.matchMedia || !window.matchMedia("(pointer: fine)").matches) return;
        const root = document.documentElement;
        let raf = 0, ev = null, lastCard = null, lastBtn = null;
        const clear = (el, props) => { if (el) props.forEach((p) => el.style.removeProperty(p)); };
        const apply = () => {
          raf = 0;
          if (!ev) return;
          root.style.setProperty("--px", ((ev.clientX / window.innerWidth) * 2 - 1).toFixed(3));
          root.style.setProperty("--py", ((ev.clientY / window.innerHeight) * 2 - 1).toFixed(3));
          const t = ev.target instanceof Element ? ev.target : null;
          const card = t && t.closest(".dojo-card");
          if (lastCard && lastCard !== card) clear(lastCard, ["--mx", "--my", "--rx", "--ry"]);
          if (card) {
            const r = card.getBoundingClientRect();
            const x = ev.clientX - r.left, y = ev.clientY - r.top;
            card.style.setProperty("--mx", `${x}px`);
            card.style.setProperty("--my", `${y}px`);
            if (card.classList.contains("dojo-card-interactive")) {
              card.style.setProperty("--rx", `${((y / r.height - 0.5) * -6).toFixed(2)}deg`);
              card.style.setProperty("--ry", `${((x / r.width - 0.5) * 6).toFixed(2)}deg`);
            }
          }
          lastCard = card;
          const btn = t && t.closest(".dojo-btn-primary");
          if (lastBtn && lastBtn !== btn) clear(lastBtn, ["--bx", "--by"]);
          if (btn && !btn.disabled) {
            const r = btn.getBoundingClientRect();
            btn.style.setProperty("--bx", `${((ev.clientX - (r.left + r.width / 2)) * 0.12).toFixed(1)}px`);
            btn.style.setProperty("--by", `${((ev.clientY - (r.top + r.height / 2)) * 0.2).toFixed(1)}px`);
          }
          lastBtn = btn;
        };
        const onMove = (e) => { ev = e; if (!raf) raf = requestAnimationFrame(apply); };
        const onLeave = () => {
          clear(lastCard, ["--mx", "--my", "--rx", "--ry"]);
          clear(lastBtn, ["--bx", "--by"]);
          lastCard = lastBtn = null;
          root.style.setProperty("--px", "0");
          root.style.setProperty("--py", "0");
        };
        window.addEventListener("pointermove", onMove, { passive: true });
        document.documentElement.addEventListener("mouseleave", onLeave);
        return () => {
          window.removeEventListener("pointermove", onMove);
          document.documentElement.removeEventListener("mouseleave", onLeave);
          onLeave();
          if (raf) cancelAnimationFrame(raf);
        };
      }, [enabled]);
    }

    // <CursorPetals>: sakura petals trail the mouse and burst on click (canvas, only runs while petals are alive)
    function CursorPetals({ enabled }) {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!enabled || !canvas || !window.matchMedia || !window.matchMedia("(pointer: fine)").matches) return;
        const ctx = canvas.getContext("2d");
        const colors = ["#ffd3dd", "#f6a3b8", "#f08fab", "#ffe3ea"];
        const parts = [];
        let w = 0, h = 0, raf = 0, lx = null, ly = null, acc = 0;
        const resize = () => {
          const dpr = Math.min(2, window.devicePixelRatio || 1);
          w = window.innerWidth; h = window.innerHeight;
          canvas.width = w * dpr; canvas.height = h * dpr;
          canvas.style.width = `${w}px`; canvas.style.height = `${h}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };
        const spawn = (x, y, burst) => {
          const a = Math.random() * Math.PI * 2;
          const sp = burst ? 1.5 + Math.random() * 3.6 : 0.2 + Math.random() * 0.8;
          parts.push({
            x, y,
            vx: Math.cos(a) * sp + (burst ? 0 : (Math.random() - 0.5) * 0.6),
            vy: Math.sin(a) * sp + (burst ? -1 : 0.3),
            rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.22,
            s: 6 + Math.random() * 7, life: 1, decay: burst ? 0.016 : 0.012,
            c: colors[(Math.random() * colors.length) | 0],
          });
          if (parts.length > 160) parts.shift();
        };
        const draw = () => {
          raf = 0;
          ctx.clearRect(0, 0, w, h);
          for (let i = parts.length - 1; i >= 0; i--) {
            const p = parts[i];
            p.x += p.vx; p.y += p.vy; p.vy += 0.035; p.vx *= 0.985; p.rot += p.vr; p.life -= p.decay;
            if (p.life <= 0) { parts.splice(i, 1); continue; }
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.life) * 0.9;
            ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-p.s * 0.7, -p.s * 0.4, -p.s * 0.5, -p.s * 1.1, 0, -p.s);
            ctx.bezierCurveTo(p.s * 0.5, -p.s * 1.1, p.s * 0.7, -p.s * 0.4, 0, 0);
            ctx.fill();
            ctx.restore();
          }
          if (parts.length) raf = requestAnimationFrame(draw);
        };
        const kick = () => { if (!raf) raf = requestAnimationFrame(draw); };
        const onMove = (e) => {
          if (e.pointerType && e.pointerType !== "mouse") return;
          if (lx !== null) {
            acc += Math.hypot(e.clientX - lx, e.clientY - ly);
            if (acc > 34) { acc = 0; spawn(e.clientX, e.clientY, false); kick(); }
          }
          lx = e.clientX; ly = e.clientY;
        };
        const onDown = (e) => {
          const t = e.target;
          if (t instanceof Element && t.closest("input,textarea,select,.CodeMirror")) return;
          for (let i = 0; i < 12; i++) spawn(e.clientX, e.clientY, true);
          kick();
        };
        resize();
        window.addEventListener("resize", resize);
        window.addEventListener("pointermove", onMove, { passive: true });
        window.addEventListener("pointerdown", onDown, { passive: true });
        return () => {
          window.removeEventListener("resize", resize);
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerdown", onDown);
          if (raf) cancelAnimationFrame(raf);
          ctx.clearRect(0, 0, w, h);
        };
      }, [enabled]);
      return <canvas ref={canvasRef} className="cursor-canvas" aria-hidden="true" />;
    }

    // --- <Slider>: swipe/drag carousel with arrows, dots, keyboard and optional autoplay ---
    function useCols(spec) {
      const pick = () => {
        const w = window.innerWidth;
        return w >= 1024 ? (spec.lg || spec.sm || spec.base || 1) : w >= 640 ? (spec.sm || spec.base || 1) : (spec.base || 1);
      };
      const [cols, setCols] = useState(pick);
      useEffect(() => {
        const onResize = () => setCols(pick());
        window.addEventListener("resize", onResize);
        return () => window.removeEventListener("resize", onResize);
      }, []);
      return cols;
    }

    function Slider({ items, label, perView = { base: 1 }, autoplay = 0, className = "" }) {
      const reduced = usePrefersReducedMotion();
      const cols = useCols(perView);
      const [index, setIndex] = useState(0);
      const [paused, setPaused] = useState(false);
      const [dragX, setDragX] = useState(0);
      const drag = useRef({ active: false, startX: 0, moved: false });
      const maxIndex = Math.max(0, items.length - cols);
      const current = Math.min(index, maxIndex);
      const go = (i) => setIndex(Math.max(0, Math.min(maxIndex, i)));

      useEffect(() => {
        if (!autoplay || reduced || paused || maxIndex === 0) return;
        const t = setInterval(() => setIndex((i) => (i >= maxIndex ? 0 : i + 1)), autoplay);
        return () => clearInterval(t);
      }, [autoplay, reduced, paused, maxIndex]);

      const onDown = (e) => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        drag.current = { active: true, startX: e.clientX, moved: false };
      };
      const onMove = (e) => {
        const d = drag.current;
        if (!d.active) return;
        const dx = e.clientX - d.startX;
        if (Math.abs(dx) > 6) d.moved = true;
        if (d.moved) setDragX(dx);
      };
      const onUp = () => {
        const d = drag.current;
        if (!d.active) return;
        d.active = false;
        if (d.moved) {
          if (Math.abs(dragX) > 60) go(current + (dragX < 0 ? 1 : -1));
          setTimeout(() => { drag.current.moved = false; }, 0);
        }
        setDragX(0);
      };
      const onKeyDown = (e) => {
        if (e.key === "ArrowRight") { e.preventDefault(); go(current + 1); }
        if (e.key === "ArrowLeft") { e.preventDefault(); go(current - 1); }
      };
      const pages = maxIndex + 1;

      return (
        <div
          className={`slider ${className}`}
          role="region"
          aria-roledescription="carousel"
          aria-label={label}
          tabIndex={0}
          onKeyDown={onKeyDown}
          onMouseEnter={() => setPaused(true)}
          onMouseLeave={() => setPaused(false)}
          onFocus={() => setPaused(true)}
          onBlur={() => setPaused(false)}
        >
          <div
            className="slider-viewport"
            onPointerDown={onDown}
            onPointerMove={onMove}
            onPointerUp={onUp}
            onPointerCancel={onUp}
            onPointerLeave={onUp}
            onClickCapture={(e) => { if (drag.current.moved) { e.preventDefault(); e.stopPropagation(); } }}
          >
            <div
              className="slider-track"
              style={{
                transform: `translateX(calc(${(-current * 100) / cols}% + ${dragX}px))`,
                transition: dragX ? "none" : undefined,
              }}
            >
              {items.map((it, i) => (
                <div
                  key={it.key}
                  className="slider-slide"
                  style={{ flex: `0 0 ${100 / cols}%` }}
                  role="group"
                  aria-roledescription="slide"
                  aria-label={`${i + 1} of ${items.length}`}
                  aria-hidden={i < current || i >= current + cols ? "true" : undefined}
                >
                  {it.node}
                </div>
              ))}
            </div>
          </div>

          {pages > 1 && (
            <div className="slider-controls">
              <button className="dojo-btn dojo-btn-icon" onClick={() => go(current - 1)} disabled={current === 0} aria-label="Previous slide">←</button>
              <div className="slider-dots" role="tablist" aria-label="Choose slide">
                {Array.from({ length: pages }, (_, i) => (
                  <button key={i} role="tab" aria-selected={i === current} aria-label={`Go to slide ${i + 1}`} className={`slider-dot ${i === current ? "is-active" : ""}`} onClick={() => go(i)} />
                ))}
              </div>
              <button className="dojo-btn dojo-btn-icon" onClick={() => go(current + 1)} disabled={current === maxIndex} aria-label="Next slide">→</button>
            </div>
          )}
        </div>
      );
    }

    // ======================================================================
    // AUTH UI (nickname + PIN, Google, phone one-time code)
    // ======================================================================
    let googleScriptPromise = null;
    function loadGoogleScript() {
      if (window.google && window.google.accounts && window.google.accounts.id) return Promise.resolve();
      if (!googleScriptPromise) {
        googleScriptPromise = new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = "https://accounts.google.com/gsi/client";
          s.async = true; s.defer = true;
          s.onload = () => resolve();
          s.onerror = () => { googleScriptPromise = null; reject(new Error("Could not load Google sign-in.")); };
          document.head.appendChild(s);
        });
      }
      return googleScriptPromise;
    }

    function friendlyAuthError(err) {
      if (err && err.status) return err.message;
      return "Can't reach the dojo server. Is the backend running at " + CONFIG.API_BASE + "?";
    }

    function Field({ id, label, hint, error, children }) {
      return (
        <div>
          <label htmlFor={id} className="block font-serif font-bold text-ink mb-2">{label}</label>
          {children}
          {(hint || error) && (
            <p id={`${id}-help`} className={`text-xs mt-2 font-mono ${error ? "text-seal" : "text-ink-soft"}`}>{error || hint}</p>
          )}
        </div>
      );
    }

    function NicknamePanel({ run, busy, onSignedIn, onGuest }) {
      const { learnerId } = useContext(DojoContext);
      const [mode, setMode] = useState("new");
      const [name, setName] = useState("");
      const [pin, setPin] = useState("");
      const [fieldError, setFieldError] = useState("");

      const submit = (e) => {
        e.preventDefault();
        setFieldError("");
        if (mode === "new") {
          const clean = name.trim();
          if (!clean) { onGuest(); return; }
          if (!/^[A-Za-z0-9 _-]{2,24}$/.test(clean)) { setFieldError("Use 2–24 letters, numbers, spaces, - or _."); return; }
          if (pin && !/^\d{4,8}$/.test(pin)) { setFieldError("A PIN is 4 to 8 digits."); return; }
          run(async () => onSignedIn(await authApi.register(clean, pin || undefined)));
        } else {
          const id = name.trim();
          if (!/^[A-Za-z0-9_-]{1,40}$/.test(id)) { setFieldError("Enter your learner ID (letters, numbers, - or _)."); return; }
          if (!/^\d{4,8}$/.test(pin)) { setFieldError("Enter your 4–8 digit PIN."); return; }
          run(async () => onSignedIn(await authApi.login(id, pin)));
        }
      };

      return (
        <form onSubmit={submit} className="space-y-5" noValidate>
          <Field
            id="nickname"
            label={mode === "new" ? "What should we call you?" : "Your learner ID"}
            hint={mode === "new" ? "Your handle in the scroll archives and streak logs." : "The ID shown in the header when you signed up."}
            error={fieldError}
          >
            <input
              id="nickname" className="dojo-input" type="text" value={name} maxLength={mode === "new" ? 24 : 40}
              onChange={(e) => setName(e.target.value)} autoComplete="username" aria-describedby="nickname-help"
              placeholder={mode === "new" ? `e.g. ${learnerId}, kenshi, py_hunter` : "e.g. kenshi_1"}
            />
          </Field>
          <Field id="pin" label={mode === "new" ? "Secret PIN (optional)" : "Secret PIN"} hint={mode === "new" ? "4–8 digits, so only you can open your progress." : undefined}>
            <input
              id="pin" className="dojo-input" type="password" inputMode="numeric" maxLength={8} value={pin}
              onChange={(e) => setPin(e.target.value.replace(/\D/g, ""))}
              autoComplete={mode === "new" ? "new-password" : "current-password"} placeholder="••••"
            />
          </Field>
          <InkButton type="submit" variant="primary" className="w-full !py-3 !text-base" disabled={busy}>
            {busy ? "One moment…" : mode === "new" ? "Enter the dojo →" : "Sign in →"}
          </InkButton>
          <button type="button" className="text-sm font-semibold text-ink underline" onClick={() => { setMode(mode === "new" ? "returning" : "new"); setFieldError(""); setPin(""); }}>
            {mode === "new" ? "I already have a PIN" : "Create a new profile instead"}
          </button>
        </form>
      );
    }

    function GooglePanel({ providers, run, busy, onSignedIn }) {
      const btnRef = useRef(null);
      const [name, setName] = useState("");
      const [state, setState] = useState("idle");
      const handler = useRef(null);
      handler.current = (credential) => run(async () => onSignedIn(await authApi.google(credential, name.trim())));
      const enabled = !!(providers && providers.google && providers.google.enabled);

      useEffect(() => {
        if (!enabled) return;
        let cancelled = false;
        setState("loading");
        loadGoogleScript()
          .then(() => {
            if (cancelled || !btnRef.current) return;
            window.google.accounts.id.initialize({
              client_id: providers.google.client_id,
              callback: (resp) => handler.current && handler.current(resp.credential),
            });
            window.google.accounts.id.renderButton(btnRef.current, { theme: "outline", size: "large", shape: "pill", text: "continue_with", width: 300 });
            setState("ready");
          })
          .catch(() => { if (!cancelled) setState("error"); });
        return () => { cancelled = true; };
      }, [enabled, providers]);

      if (!providers) return <p className="text-sm text-ink-soft">Checking sign-in options…</p>;
      if (!enabled) {
        return (
          <div className="dojo-inset p-4 text-sm space-y-2">
            <p className="font-semibold text-ink">Google sign-in isn't set up on this server yet.</p>
            <p className="text-ink-soft">Add a Google OAuth <span className="font-mono">GOOGLE_CLIENT_ID</span> to <span className="font-mono">backend/.env</span> and restart the backend to switch it on. Until then, use the Nickname or Phone tab.</p>
          </div>
        );
      }
      return (
        <div className="space-y-4">
          <Field id="g-name" label="Display name (new accounts)" hint="Optional. Your Google name and email are never stored.">
            <input id="g-name" className="dojo-input" type="text" maxLength={24} value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. kenshi" aria-describedby="g-name-help" />
          </Field>
          <div className={`google-slot ${busy ? "opacity-60 pointer-events-none" : ""}`} ref={btnRef} />
          {state === "loading" && <p className="text-xs font-mono text-ink-soft">Loading Google…</p>}
          {state === "error" && <p className="text-xs font-mono text-seal" role="alert">Could not load Google sign-in. Check your connection and try again.</p>}
        </div>
      );
    }

    function PhonePanel({ providers, run, busy, onSignedIn }) {
      const [step, setStep] = useState("number");
      const [phone, setPhone] = useState("+91 ");
      const [code, setCode] = useState("");
      const [name, setName] = useState("");
      const [fieldError, setFieldError] = useState("");
      const [cooldown, setCooldown] = useState(0);

      useEffect(() => {
        if (cooldown <= 0) return;
        const t = setTimeout(() => setCooldown((c) => c - 1), 1000);
        return () => clearTimeout(t);
      }, [cooldown]);

      const cleanPhone = () => phone.replace(/[\s\-().]/g, "");
      const sendCode = (e) => {
        if (e) e.preventDefault();
        setFieldError("");
        if (!/^\+[1-9]\d{7,14}$/.test(cleanPhone())) { setFieldError("Use international format, e.g. +919876543210."); return; }
        run(async () => { await authApi.phoneRequest(cleanPhone()); setStep("code"); setCode(""); setCooldown(30); });
      };
      const verify = (e) => {
        e.preventDefault();
        setFieldError("");
        if (!/^\d{6}$/.test(code)) { setFieldError("Enter the 6-digit code."); return; }
        const nick = name.trim();
        if (nick && !/^[A-Za-z0-9 _-]{2,24}$/.test(nick)) { setFieldError("Use 2–24 letters, numbers, spaces, - or _ for your name."); return; }
        run(async () => onSignedIn(await authApi.phoneVerify(cleanPhone(), code, nick)));
      };

      const devMode = providers && providers.phone && providers.phone.dev_mode;

      if (step === "number") {
        return (
          <form onSubmit={sendCode} className="space-y-5" noValidate>
            <Field id="phone" label="Phone number" hint="We text you a 6-digit code. Only a one-way hash of your number is kept." error={fieldError}>
              <input id="phone" className="dojo-input" type="tel" inputMode="tel" autoComplete="tel" value={phone} maxLength={20} onChange={(e) => setPhone(e.target.value)} aria-describedby="phone-help" placeholder="+91 98765 43210" />
            </Field>
            <InkButton type="submit" variant="primary" className="w-full !py-3 !text-base" disabled={busy}>{busy ? "Sending…" : "Send code →"}</InkButton>
            {devMode && <p className="text-xs font-mono text-ink-soft dojo-inset p-3">Developer mode: no SMS provider is configured, so the code is printed in the backend console instead of being texted.</p>}
          </form>
        );
      }
      return (
        <form onSubmit={verify} className="space-y-5" noValidate>
          <Field id="otp" label={`Code sent to ${cleanPhone()}`} hint={devMode ? "Developer mode: read the code in the backend console." : "It expires in 5 minutes."} error={fieldError}>
            <input id="otp" className="dojo-input tracking-[0.4em] text-center text-xl font-mono" type="text" inputMode="numeric" autoComplete="one-time-code" maxLength={6} value={code} onChange={(e) => setCode(e.target.value.replace(/\D/g, ""))} aria-describedby="otp-help" placeholder="••••••" autoFocus />
          </Field>
          <Field id="p-name" label="Display name (new accounts)">
            <input id="p-name" className="dojo-input" type="text" maxLength={24} value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. kenshi" />
          </Field>
          <InkButton type="submit" variant="primary" className="w-full !py-3 !text-base" disabled={busy}>{busy ? "Verifying…" : "Verify & enter →"}</InkButton>
          <div className="flex items-center justify-between text-sm">
            <button type="button" className="font-semibold text-ink underline" onClick={() => { setStep("number"); setFieldError(""); }}>Change number</button>
            <button type="button" className="font-semibold text-ink underline disabled:opacity-50 disabled:no-underline" disabled={cooldown > 0 || busy} onClick={() => sendCode()}>
              {cooldown > 0 ? `Resend in ${cooldown}s` : "Resend code"}
            </button>
          </div>
        </form>
      );
    }

    // <AuthCard>: the "Enter the Dojo" card with Nickname / Google / Phone sign-in
    function AuthCard({ onDone }) {
      const { signIn } = useContext(DojoContext);
      const [tab, setTab] = useState("dojo");
      const [providers, setProviders] = useState(null);
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState("");
      const busyRef = useRef(false);

      useEffect(() => {
        let alive = true;
        authApi.providers().then((p) => alive && setProviders(p)).catch(() => alive && setProviders({ pin: { enabled: true }, google: { enabled: false }, phone: { enabled: true, dev_mode: false } }));
        return () => { alive = false; };
      }, []);

      // Single-flight wrapper: blocks duplicate submissions and turns failures into a friendly message
      const run = async (fn) => {
        if (busyRef.current) return;
        busyRef.current = true;
        setBusy(true);
        setError("");
        try { await fn(); } catch (err) { setError(friendlyAuthError(err)); } finally { busyRef.current = false; setBusy(false); }
      };
      const onSignedIn = (r) => { signIn({ learnerId: r.learner_id, token: r.token }); onDone(); };
      const tabs = [["dojo", "Nickname"], ["google", "Google"], ["phone", "Phone"]];

      return (
        <div className="dojo-card p-6 md:p-8 space-y-5" aria-labelledby="enter-title">
          <div>
            <h2 id="enter-title" className="font-serif text-2xl md:text-3xl font-bold text-ink">Enter the Dojo</h2>
            <p className="text-sm text-ink-soft mt-1">Begin your apprenticeship in Python bug hunting.</p>
          </div>

          <div className="auth-tabs" role="tablist" aria-label="Sign-in method">
            {tabs.map(([key, label]) => (
              <button key={key} role="tab" id={`tab-${key}`} aria-selected={tab === key} aria-controls={`panel-${key}`} className={`auth-tab ${tab === key ? "is-active" : ""}`} onClick={() => { setTab(key); setError(""); }}>
                {label}

          <div role="tabpanel" id={`panel-${tab}`} aria-labelledby={`tab-${tab}`} key={tab} className="page-enter">

            {tab === "google" && <GooglePanel providers={providers} run={run} busy={busy} onSignedIn={onSignedIn} />}
            {tab === "phone" && <PhonePanel providers={providers} run={run} busy={busy} onSignedIn={onSignedIn} />}

          {error && <div role="alert" className="dojo-inset p-3 text-sm text-seal font-semibold" style={{ borderColor: "rgb(var(--seal-rgb) / .45)" }}>{error}</div>}

          <p className="text-center text-xs font-mono text-ink-soft dojo-inset py-2.5 px-3">
            No real names or emails stored. Google and phone sign-in keep only a one-way hash.
          </p>
        </div>
      );
    }

    // <LoadError>: shown when a learner endpoint fails (protected profile, network down, server error)
    function LoadError({ error, onNavigate, onRetry }) {
      const authIssue = error && (error.status === 401 || error.status === 403);
      const handleSetApi = () => {
        const current = CONFIG.API_BASE || "";
        const entered = window.prompt("Enter your Debug Dojo backend API URL (e.g. https://your-backend.railway.app):", current);
        if (entered !== null) {
          try {
            localStorage.setItem("debug_dojo_api_base", entered.trim().replace(/\/$/, ""));
            window.location.reload();
          } catch (e) {}
        }
      };

      return (
        <PaperCard accent className="text-center space-y-4 max-w-xl mx-auto" pad="p-8">
          <Seal char={authIssue ? "鍵" : "障"} size="lg" />
          <h3 className="font-serif text-2xl font-bold text-ink">{authIssue ? "This profile is protected" : "The scroll could not be unrolled"}</h3>
          <p className="text-ink-soft text-sm">
            {authIssue ? "Sign in to open this learner's progress." : friendlyAuthError(error)}
          </p>
          <div className="flex flex-wrap gap-3 justify-center">
            {authIssue && <InkButton variant="primary" onClick={() => onNavigate("/welcome")}>Sign in</InkButton>}
            {onRetry && <InkButton variant="secondary" onClick={onRetry}>Try again</InkButton>}
            {!authIssue && (
              <>
                <InkButton variant="primary" onClick={() => {
                  const url = new URL(window.location);
                  url.searchParams.set("mock", "1");
                  window.location.href = url.toString();
                }}>
                  Try Demo / Mock Mode
                </InkButton>
                <InkButton variant="secondary" onClick={handleSetApi}>
                  Set Backend URL
                </InkButton>
              </>
            )}
          </div>
        </PaperCard>
      );
    }

    // Kata card used inside the dashboard slider
    function KataSlideCard({ c, onOpen }) {
      const st = STATUS_META[c.status] || STATUS_META.new;
      return (
        <PaperCard interactive onClick={onOpen} className="h-full" pad="p-5">
          <div className="flex items-center justify-between gap-2 mb-3">
            <span className="pill uppercase">{c.difficulty}</span>
            <span className={`pill ${st.pill}`}>{st.label}</span>
          </div>
          <h4 className="font-serif text-xl font-bold text-ink">{c.title}</h4>
          <div className="flex flex-wrap gap-1.5 mt-3">
            {c.concepts.map((concept) => <span key={concept} className="pill !py-0 !text-[11px]">#{concept}</span>)}
          </div>
          <div className="mt-4 text-xs font-mono font-medium text-seal">Attempt Kata →</div>
        </PaperCard>
      );
    }

    // <LiveHintsPanel>: three-layer hints about the code currently in the editor, refreshed as you type
    function LiveHintsPanel({ live, codeIsBlank }) {
      const layers = [["Nudge", "pill-indigo"], ["Pointer", "pill-ochre"], ["Approach", "pill-seal"]];
      const { status, ladder } = live;
      return (
        <section aria-label="Live hints for your code" className="mb-4 pb-4 border-b border-blossom/30">
          <div className="flex items-center justify-between gap-2 mb-2.5">
            <div className="flex items-center gap-2">
              <span className={`w-2 h-2 rounded-full ${status === "loading" ? "bg-ochre animate-pulse" : status === "error" ? "bg-seal" : "bg-pine live-dot"}`}></span>
              <span className="eyebrow !text-ink-soft">Live hints</span>
            </div>
            <span className="text-[11px] font-mono text-ink-soft">
              {status === "loading" ? "reading your code…" : status === "error" ? "unavailable" : ladder.length ? "updates as you type" : "watching your code"}
            </span>
          </div>
          <div aria-live="polite">
            {status === "error" ? (
              <p className="text-xs font-mono text-seal">Could not analyse your code right now ({live.message || "network error"}). It will retry when you keep typing.</p>
            ) : ladder.length ? (
              <div className="space-y-2">
                {ladder.map((text, i) => (
                  <div key={i} className="dojo-inset p-3 text-xs leading-relaxed flex gap-3 items-start border border-blossom/20 page-enter" style={{ animationDelay: `${i * 60}ms` }}>
                    <Seal char={String(i + 1)} size="sm" />
                    <div className="min-w-0 flex-1">
                      <span className={`pill ${layers[i][1]} text-[10px] uppercase tracking-wider font-bold mb-1`}>{layers[i][0]}</span>
                      <div className="text-ink font-sans">{text}</div>
                    </div>
                  </div>
                ))}
                {live.notes && live.notes.length > 0 && (
                  <div className="dojo-inset p-3 text-xs leading-relaxed">
                    <div className="eyebrow !text-ink-soft mb-1">Also noticed</div>
                    <ul className="list-disc pl-4 space-y-1 text-ink">
                      {live.notes.map((n, i) => <li key={i}>{n}</li>)}
                    </ul>
                  </div>
                )}
              </div>
            ) : status === "loading" && !ladder.length ? (
              <p className="text-xs font-mono text-ink-soft">Reading your code…</p>
            ) : (
              <p className="text-xs font-mono text-ink-soft leading-relaxed">
                {codeIsBlank ? "Start typing in solution.py and hints will appear here." : "Nothing looks structurally wrong with your code. Click Run Visible and the hints will react to which tests fail."}
              </p>
            )}
          </div>
        </section>
      );

    // --- PAGES ---
    const DIFFICULTY_META = {
      easy: { kanji: "初段", label: "Easy Katas" },
      medium: { kanji: "弐段", label: "Medium Katas" },
      hard: { kanji: "参段", label: "Hard Katas" },
    };
    const STATUS_META = {
      solved: { label: "Solved", ring: "is-solved", mark: "✓", pill: "pill-pine" },
      attempted: { label: "Attempted", ring: "is-attempted", mark: "", pill: "pill-ochre" },
      new: { label: "New", ring: "is-new", mark: "", pill: "" },
    };

    // 1. Dashboard Page (Route: /)
    function DashboardPage({ onNavigate }) {
      const { learnerId } = useContext(DojoContext);
      const [learner, setLearner] = useState(null);
      const [challenges, setChallenges] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [reload, setReload] = useState(0);

      useEffect(() => {
        let alive = true;
        async function load() {
          setLoading(true);
          setError(null);
          try {
            const [lData, cData] = await Promise.all([
              api.getLearner(learnerId),
              api.listChallenges()
            ]);
            if (!alive) return;
            setLearner(lData);
            setChallenges(cData);
          } catch (e) {
            if (alive) setError(e);
          } finally {
            if (alive) setLoading(false);
          }
        }
        load();
        return () => { alive = false; };
      }, [learnerId, reload]);

      if (loading) return <Loader label="Unfurling scroll records..." />;
      if (error || !learner) return <LoadError error={error} onNavigate={onNavigate} onRetry={() => setReload((n) => n + 1)} />;

      const order = ["easy", "medium", "hard"];
      const extra = [...new Set(challenges.map((c) => c.difficulty))].filter((d) => !order.includes(d));
      const groups = [...order, ...extra]
        .map((d) => ({ key: d, items: challenges.filter((c) => c.difficulty === d) }))
        .filter((g) => g.items.length > 0);

      return (
        <div className="space-y-8 md:space-y-10">
          {/* Hero greeting */}
          <Reveal>
            <section className="dojo-card dojo-card-accent overflow-hidden p-6 md:p-10">
              <div className="absolute -right-4 -top-10 font-serif text-[16rem] leading-none opacity-[0.06] select-none pointer-events-none" aria-hidden="true">桜</div>
              <Eyebrow dot>道場 · Dashboard</Eyebrow>
              <h1 className="hero-title mt-3 text-ink">
                {greeting()},<br />
                <span className="gradient-text break-all">{learnerId}.</span>
              </h1>
              <p className="text-ink-soft text-base md:text-lg mt-4 max-w-xl">
                Observe your bug-hunting mastery, streaks, and recommended training.
              </p>
              <div className="flex flex-wrap items-center gap-2 mt-5">
                <span className="pill pill-ochre">Rank: Apprentice Hunter</span>
                <span className="pill">Longest streak: {learner.stats.longest_streak}</span>
              </div>
            </section>
          </Reveal>

          {/* Stats */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <Reveal delay={60} className="h-full">
              <PaperCard className="h-full overflow-hidden">
                <span className="absolute right-3 bottom-0 font-serif text-7xl opacity-[0.07] select-none" aria-hidden="true">虫</span>
                <CountUp value={learner.stats.bugs_defeated} label="Bugs Defeated" />
                <p className="text-xs text-ink-soft mt-3 font-mono">Found & excised independently</p>
              </PaperCard>
            </Reveal>

            <Reveal delay={120} className="h-full">
              <PaperCard className="h-full overflow-hidden">
                <span className="absolute right-3 bottom-0 font-serif text-7xl opacity-[0.07] select-none" aria-hidden="true">連</span>
                <CountUp value={learner.stats.independent_streak} label="Current Streak" suffix=" runs" />
                <p className="text-xs text-pine font-mono mt-3 font-semibold">Longest: {learner.stats.longest_streak}</p>
              </PaperCard>
            </Reveal>

            <Reveal delay={180} className="h-full">
              <PaperCard className="h-full overflow-hidden">
                <span className="absolute right-3 bottom-0 font-serif text-7xl opacity-[0.07] select-none" aria-hidden="true">心</span>
                <CountUp value={Math.round(learner.stats.prediction_accuracy * 100)} label="Prediction Accuracy" suffix="%" />
                <p className="text-xs text-ink-soft mt-3 font-mono">Mental simulation skill</p>
              </PaperCard>
            </Reveal>

            <Reveal delay={240} className="h-full">
              <PaperCard className="h-full overflow-hidden">
                <span className="absolute right-3 bottom-0 font-serif text-7xl opacity-[0.07] select-none" aria-hidden="true">経</span>
                <CountUp value={learner.stats.xp} label="Dojo Experience (XP)" />
                <p className="text-xs text-ochre font-mono mt-3 font-semibold">Rank: Apprentice Hunter</p>
              </PaperCard>
            </Reveal>
          </div>

          {/* Next Recommended Challenge Callout */}
          {learner.next_challenge && (
            <Reveal delay={300}>
              <PaperCard accent className="overflow-hidden" pad="p-6 md:p-8">
                <div className="absolute right-5 top-5 opacity-20 hidden sm:block float-slow" aria-hidden="true">
                  <Seal char="道" size="xl" />
                </div>
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-5 relative">
                  <div className="max-w-2xl">
                    <Eyebrow>Recommended Dojo Kata</Eyebrow>
                    <h3 className="font-serif text-2xl md:text-3xl font-bold mt-2 text-ink">
                      {learner.next_challenge.title}
                    </h3>
                    <p className="text-ink-soft text-sm md:text-base mt-2 border-l-2 border-blossom/60 pl-3 italic">
                      {learner.next_challenge.reason}
                    </p>
                  </div>
                  <InkButton
                    variant="primary"
                    className="self-start md:self-center md:mr-20 !px-6 !py-3"
                    onClick={() => onNavigate(`/challenge/${learner.next_challenge.id}`)}
                  >
                    Enter Challenge →
                  </InkButton>
                </div>
              </PaperCard>
            </Reveal>
          )}

          {/* Continue your path — draggable slider of attempted + new katas */}
          {(() => {
            const todo = [...challenges.filter((c) => c.status === "attempted"), ...challenges.filter((c) => c.status === "new")].slice(0, 8);
            if (todo.length === 0) return null;
            return (
              <Reveal delay={340}>
                <section aria-labelledby="path-title" className="space-y-4">
                  <div>
                    <h3 id="path-title" className="font-serif text-2xl md:text-3xl font-bold text-ink">Continue Your Path</h3>
                    <p className="text-sm text-ink-soft mt-1">Pick up an attempted kata or start a fresh one. Drag, swipe, or use the arrows.</p>
                  </div>
                  <Slider
                    label="Katas to continue"
                    perView={{ base: 1, sm: 2, lg: 3 }}
                    items={todo.map((c) => ({ key: c.id, node: <KataSlideCard c={c} onOpen={() => onNavigate(`/challenge/${c.id}`)} /> }))}
                  />
                </section>
              </Reveal>
            );
          })()}

          {/* Dojo Challenges Overview — grouped by rank */}
          <section className="space-y-6" aria-labelledby="archive-title">
            <div className="flex items-end justify-between gap-4">
              <div>
                <h3 id="archive-title" className="font-serif text-2xl md:text-3xl font-bold text-ink">Challenge Scroll Archive</h3>
                <p className="text-sm text-ink-soft mt-1">Select a kata to inspect tests and hunt bugs.</p>
              </div>
              <span className="pill hidden sm:inline-flex">{challenges.length} Katas Available</span>
            </div>

            {groups.map((g, gi) => {
              const meta = DIFFICULTY_META[g.key] || { kanji: "段", label: `${g.key} Katas` };
              return (
                <div key={g.key} className="space-y-3">
                  <div className="flex items-center gap-3">
                    <span className="font-serif text-lg md:text-xl font-bold text-ink">
                      <span className="text-seal mr-1.5">{meta.kanji}</span>/ {meta.label}
                    </span>
                    <span className="pill">{g.items.length} {g.items.length === 1 ? "Challenge" : "Challenges"}</span>
                    <hr className="dojo-divider flex-1" />
                  </div>
                  <div className="grid grid-cols-1 gap-3">
                    {g.items.map((c, i) => {
                      const st = STATUS_META[c.status] || STATUS_META.new;
                      const isNext = learner.next_challenge && learner.next_challenge.id === c.id;
                      return (
                        <Reveal key={c.id} delay={gi * 60 + i * 50}>
                          <PaperCard
                            interactive
                            pad="p-0"
                            onClick={() => onNavigate(`/challenge/${c.id}`)}
                            className={isNext ? "dojo-card-accent" : ""}
                          >
                            <div className="kata-row">
                              <span className={`status-ring ${st.ring}`} aria-hidden="true">{st.mark}</span>
                              <div className="min-w-0 flex-1">
                                <div className="flex items-center gap-2 flex-wrap">
                                  <h4 className="font-serif text-lg font-bold text-ink">{c.title}</h4>
                                  {isNext && <span className="pill pill-seal !py-0">Next up</span>}
                                </div>
                                <div className="flex flex-wrap gap-1.5 mt-1.5">
                                  {c.concepts.map((concept) => (
                                    <span key={concept} className="pill !py-0 !text-[11px]">#{concept}</span>
                                  ))}
                                </div>
                              </div>
                              <div className="flex flex-col items-end gap-1.5 flex-none">
                                <span className={`pill ${st.pill}`}>{st.label}</span>
                                <span className="text-xs font-mono font-medium text-seal hidden sm:inline">Attempt Kata →</span>
                              </div>
                            </div>
                          </PaperCard>
                        </Reveal>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </section>
        </div>
      );
    }

    // 2. Welcome Page (Route: /welcome)
    function WelcomePage({ onNavigate }) {

        ["予", "Predict before you run", "Commit to what you think will happen, then run. Your prediction accuracy is tracked on your dashboard."],
        ["走", "Run in the sandbox", "Try your code against the visible tests as often as you like. Submitting also grades hidden tests, and only pass or fail outcomes are ever shown, never the answers."],
        ["灯", "Socratic hints", "Stuck? Ask for progressive nudges. They point at where to look and never hand you the fix."],

        ["闘", "Bug Arena", "Every submission shows which bug spirits you have defeated and which are still lurking."],
