                </p>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-8 pt-6 border-t border-blossom/30 max-w-2xl">
                  {[
                    ["01 / Inspect", "Mental Trace", "Predict outputs before executing code."],
                    ["02 / Excise", "Targeted Hints", "Progressive nudges, never solutions."],
                    ["03 / Ingrain", "Bug DNA", "Pinpoint cognitive loops to unlearn habits."],
                  ].map(([k, t, d]) => (
                    <div key={k}>
                      <div className="eyebrow !text-[10.5px]">{k}</div>
                      <div className="font-serif text-lg font-bold text-ink mt-1">{t}</div>
                      <p className="text-sm text-ink-soft mt-0.5">{d}</p>
                    </div>
                  ))}
                </div>
              </div>
            </Reveal>

            <Reveal delay={120}>
              <div className="relative pt-16 sm:pt-20">
                <div className="hero-lanterns">
                  <Lantern char="道" size={46} delay={0} hang={30} />
                  <Lantern char="場" size={38} delay={-1.6} hang={40} />
                  <Lantern char="桜" size={42} delay={-3.1} hang={22} />
                </div>
                <AuthCard onDone={() => onNavigate("/")} />
              </div>
            </Reveal>
          </section>

          <Reveal>
            <section aria-labelledby="modes-title" className="space-y-4">
              <div>
                <Eyebrow>Training modes</Eyebrow>
                <h3 id="modes-title" className="font-serif text-2xl md:text-3xl font-bold text-ink mt-1">How the dojo trains you</h3>
              </div>
              <Slider
                label="Training modes"
                autoplay={6500}
                perView={{ base: 1, lg: 1 }}
                items={MODE_SLIDES.map(([kanji, title, body]) => ({
                  key: title,
                  node: (
                    <PaperCard accent className="h-full" pad="p-6 md:p-8">
                      <div className="flex flex-col sm:flex-row sm:items-center gap-5">
                        <Seal char={kanji} size="xl" />
                        <div>
                          <h4 className="font-serif text-2xl font-bold text-ink">{title}</h4>
                          <p className="text-ink-soft mt-2 max-w-2xl">{body}</p>
                        </div>
                      </div>
                    </PaperCard>
                  ),
                }))}
              />
            </section>
          </Reveal>

          <Reveal delay={80}>
            <PaperCard className="space-y-4" pad="p-6 md:p-8">
              <h3 className="font-serif text-xl md:text-2xl font-bold text-ink">The Dojo Philosophy</h3>
              <p className="text-ink">
                Most platforms tell you what to type. The <strong>Debug Dojo</strong> trains your mental execution model. When code misbehaves, real programmers do not guess—they inspect, hypothesize, and bound their edge cases.
              </p>
              <div className="dojo-inset p-4 md:p-5 font-mono text-sm space-y-2">
                <div className="text-seal font-semibold">Three Principles of the Dojo:</div>
                <ol className="list-decimal pl-5 space-y-1 text-ink-soft">
                  <li><strong className="text-ink">No Leaked Secrets:</strong> Hidden test implementations are never revealed; only pure outcomes.</li>
                  <li><strong className="text-ink">Prediction Before Execution:</strong> Formulate what should happen before running the code.</li>
                  <li><strong className="text-ink">Ink on Paper:</strong> Tracing index mathematics with quiet focus beats frantic AI generation.</li>
                </ol>
              </div>
            </PaperCard>
          </Reveal>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            {[
              ["01", "Inspect Visible Tests", "Study test inputs, invocations, and expected outcomes."],
              ["02", "Formulate & Submit", "Run tests. Analyze hidden test failures and mistake DNA."],
              ["03", "Request Socratic Hints", "Guided inquiry without spoiling the realization."],
            ].map(([n, t, d], i) => (
              <Reveal key={n} delay={140 + i * 70} className="h-full">
                <PaperCard className="h-full" interactive={false}>
                  <div className="font-serif text-3xl font-bold text-seal/90 mb-1">{n}</div>
                  <h4 className="font-bold text-sm mb-1 text-ink">{t}</h4>
                  <p className="text-xs text-ink-soft">{d}</p>
                </PaperCard>
              </Reveal>
            ))}
          </div>

          <div className="flex flex-col sm:flex-row gap-3 sm:gap-4">
            <InkButton variant="primary" className="!py-3" onClick={() => onNavigate("/challenge/last-k-total")}>
              Begin First Kata: Last K Total →
            </InkButton>
            <InkButton variant="secondary" className="!py-3" onClick={() => onNavigate("/")}>
              View Dashboard
            </InkButton>
          </div>
        </div>
      );
    }

    // 3. Challenge Page (Route: /challenge/:id) - LeetCode Workbench with Sakura Design
    function ChallengePage({ challengeId = "last-k-total", onNavigate }) {
      const { learnerId, focusMode, setFocusMode, isFocusActive } = useContext(DojoContext);
      const [challenge, setChallenge] = useState(null);
      const [code, setCode] = useState("");
      const [error, setError] = useState(null);

      // Focus Mode Sub-state (Collapsing description panel to slim toggle)
      const [descCollapsed, setDescCollapsed] = useState(false);

      // When focus mode toggles, collapse or expand description panel accordingly
      useEffect(() => {
        if (isFocusActive) {
          setDescCollapsed(true);
        } else {
          setDescCollapsed(false);
        }
      }, [isFocusActive]);

      // Focus mode keyboard shortcuts: 'F' toggles focus mode (when editor/inputs not focused); 'Escape' exits focus mode
      useEffect(() => {
        const handleFocusKeys = (e) => {
          // Escape exits focus mode
          if (e.key === "Escape" && isFocusActive) {
            e.preventDefault();
            if (setFocusMode) setFocusMode(false);
            return;
          }

          // F key toggles focus mode when editor and input fields are not focused
          if ((e.key === "f" || e.key === "F") && !e.ctrlKey && !e.metaKey && !e.altKey) {
            const active = document.activeElement;
            const isInput = active && (
              active.tagName === "INPUT" ||
              active.tagName === "TEXTAREA" ||
              active.tagName === "SELECT" ||
              active.isContentEditable ||
              (active.closest && (active.closest(".CodeMirror") || active.closest(".code-window")))
            );
            if (!isInput) {
              e.preventDefault();
              if (setFocusMode) setFocusMode(prev => !prev);
            }
          }
        };

        window.addEventListener("keydown", handleFocusKeys, true);
        return () => window.removeEventListener("keydown", handleFocusKeys, true);
      }, [isFocusActive, setFocusMode]);

      // Workbench Execution States
      const [runResult, setRunResult] = useState(null);
      const [submitResult, setSubmitResult] = useState(null);
      const [lastAction, setLastAction] = useState(null); // 'run' | 'submit' | null
      const [running, setRunning] = useState(false);
      const [submitting, setSubmitting] = useState(false);
      const [activeCaseTab, setActiveCaseTab] = useState(0); // number or 'hidden'
      const [prediction, setPrediction] = useState("");

      // Left Pane States (Description vs Submissions)
      const [activeLeftTab, setActiveLeftTab] = useState("description"); // 'description' | 'submissions'
      const [historyList, setHistoryList] = useState(null);
      const [historyLoading, setHistoryLoading] = useState(false);
      const [inspectingSubmission, setInspectingSubmission] = useState(null);

      // Socratic Hints
      const [lastSubmitted, setLastSubmitted] = useState(null); // {id, code} of the latest graded submit

      // Split Pane Resizing
      const [splitPercent, setSplitPercent] = useState(44);
      const [isDragging, setIsDragging] = useState(false);
      const splitContainerRef = useRef(null);

      // Load challenge and starter code / draft
      useEffect(() => {
        async function load() {
          try {
            setError(null);
            setRunResult(null);
            setSubmitResult(null);
            setLastAction(null);
            setHistoryList(null);
            setInspectingSubmission(null);
            setActiveCaseTab(0);

            const data = await api.getChallenge(challengeId);
            setChallenge(data);
            const draft = await api.getDraft(learnerId, challengeId);
            setCode(draft || data.starter_code);
          } catch (err) {
            setError("Could not retrieve challenge scroll from the archive.");
          }
        }
        load();
      }, [challengeId, learnerId]);

      // Split pane drag resizing
      const handleMouseDown = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!isDragging || !splitContainerRef.current) return;
          const rect = splitContainerRef.current.getBoundingClientRect();
          const newPercent = ((e.clientX - rect.left) / rect.width) * 100;
          setSplitPercent(Math.max(25, Math.min(75, newPercent)));
        };

        const handleMouseUp = () => {
          if (isDragging) setIsDragging(false);
        };

        if (isDragging) {
          window.addEventListener("mousemove", handleMouseMove);
          window.addEventListener("mouseup", handleMouseUp);
        }
        return () => {
          window.removeEventListener("mousemove", handleMouseMove);
          window.removeEventListener("mouseup", handleMouseUp);
        };
      }, [isDragging]);

      // Submissions History Loader
      const loadSubmissions = async () => {
        setHistoryLoading(true);
        try {
          const list = await api.getChallengeSubmissions(learnerId, challengeId);
          setHistoryList(list || []);
        } catch (err) {
          setError("Could not retrieve submission chronicles.");
        } finally {
          setHistoryLoading(false);
        }
      };

      const handleInspectSubmission = async (subId) => {
        setHistoryLoading(true);
        try {
          const detail = await api.getSubmission(subId);
          setInspectingSubmission(detail);
        } catch (err) {
          setError("Could not load snapshot for that submission.");
        } finally {
          setHistoryLoading(false);
        }
      };

      // Run button: POST /api/run
      const handleRun = async () => {
        if (running || submitting) return;
        setRunning(true);
        setError(null);
        try {
          const res = await api.run(learnerId, challengeId, code);
          setRunResult(res);
          setRanCode(code);
          setLastAction("run");
          setActiveCaseTab(0);
        } catch (err) {
          setError(err.message || "Execution failed or timed out.");
        } finally {
          setRunning(false);
        }
      };

      // Submit button: POST /api/submit
      const handleSubmit = async () => {
        if (running || submitting) return;
        setSubmitting(true);
        setError(null);
        try {
          const res = await api.submit(learnerId, challengeId, code, prediction || undefined);
          setSubmitResult(res);
          setLastSubmitted({ id: res.submission_id, code });
          setRanCode(code);
          setLastAction("submit");
          setActiveCaseTab(0);
          // Refresh submissions if tab was visited or open
          if (historyList !== null) {
            loadSubmissions();
          }
        } catch (err) {
          setError(err.message || "Evaluation timed out or was interrupted.");
        } finally {
          setSubmitting(false);
        }
      };

      // Live hints: re-analyse the editor code ~0.6s after you stop typing. If you have run the visible tests on this
      // exact code, their pass/fail outcomes are included so the hints can point at what actually failed.
      const [liveHints, setLiveHints] = useState({ status: "idle", ladder: [], focus: null });
      const [ranCode, setRanCode] = useState(null);
      useEffect(() => {
        if (!challenge) return;
        let alive = true;
        setLiveHints((prev) => ({ ...prev, status: "loading" }));
        const timer = setTimeout(async () => {
          const result = lastAction === "submit" && submitResult ? submitResult.visible : lastAction === "run" && runResult ? runResult.visible : null;
          const outcomes = ranCode === code && result ? result.map((v) => v.outcome) : undefined;
          try {
            const res = await api.getLiveHints({ challenge_id: challengeId, code, visible_outcomes: outcomes });
            if (alive) setLiveHints({ status: "ready", ladder: res.ladder || [], focus: res.focus || null, notes: res.notes || [] });
          } catch (e) {
            if (alive) setLiveHints({ status: "error", ladder: [], focus: null, message: e.message });
          }
        }, 600);
        return () => { alive = false; clearTimeout(timer); };
      }, [code, challengeId, !!challenge, runResult, submitResult, lastAction, ranCode]);

      // Keyboard shortcuts: Ctrl/Cmd+Enter = Run, Ctrl/Cmd+Shift+Enter = Submit
      useEffect(() => {
        const handleKeyDown = (e) => {
          const isMod = e.ctrlKey || e.metaKey;
          if (isMod && e.key === "Enter") {
            e.preventDefault();
            if (e.shiftKey) {
              if (!submitting && !running) handleSubmit();
            } else {
              if (!running && !submitting) handleRun();
            }
          }
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [code, learnerId, challengeId, running, submitting, prediction, historyList]);

      if (!challenge) {
        return (
          <>
            <ErrorBanner message={error} onDismiss={() => setError(null)} />
            {!error && <Loader label="Loading kata parchment..." />}
          </>
        );
      }

      // Presets for quick experimentation
      const applyBuggyPreset = () => {
        if (challengeId === "last-k-total") {
          setCode("def last_k_total(marks, k):\n    start = len(marks) - k\n    return sum(marks[start:])\n");
        } else if (challengeId === "middle-three") {
          setCode("def middle_three(items):\n    mid = len(items) // 2\n    return items[mid-1:mid+2]\n");
        } else {
          setCode(challenge.starter_code);
        }
      };

      const applyPassingPreset = () => {
        if (challengeId === "last-k-total") {
          setCode("def last_k_total(marks, k):\n    start = max(0, len(marks) - k)\n    return sum(marks[start:])\n");
        } else if (challengeId === "middle-three") {
          setCode("def middle_three(items):\n    if len(items) < 3:\n        return []\n    mid = len(items) // 2\n    return items[mid-1:mid+2]\n");
        } else {
          setCode(challenge.starter_code);
        }
      };

      // Visible test items depending on last action
      const activeVisibleTests = lastAction === "submit" && submitResult
        ? submitResult.visible
        : lastAction === "run" && runResult
        ? runResult.visible
        : challenge.visible_tests;

      const currentCase = typeof activeCaseTab === "number" && activeVisibleTests[activeCaseTab]
        ? activeVisibleTests[activeCaseTab]
        : null;

      return (
        <div className={isFocusActive ? "h-full flex flex-col min-h-0 space-y-2 overflow-hidden" : "space-y-4"}>
          <Reveal>
            <div className={`dojo-card dojo-card-accent overflow-hidden transition-all ${
              isFocusActive
                ? "p-2.5 px-4 flex flex-row items-center justify-between gap-3 flex-none mb-1"
                : "p-4 md:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4"
            }`}>
              <div className="min-w-0 flex items-center gap-3">
                <div className="flex items-center flex-wrap gap-2">
                  <span className="pill pill-seal uppercase text-[11px]">{challenge.difficulty} Kata</span>
                  {!isFocusActive && (
                    <span className="pill text-[11px]">{challenge.hidden_test_count} Hidden Tests Guarded</span>
                  )}
                </div>
                <RuleHeading title={challenge.title} level={1} className={isFocusActive ? "!text-base !mb-0 truncate" : "!mb-0"} />
              </div>
              {!isFocusActive && challenge.description && (
                <p className="text-xs text-ink-soft leading-relaxed sm:max-w-md md:max-w-lg">{challenge.description}</p>
              )}
              <div className="flex items-center gap-2 flex-none">
                {/* Focus toggle button */}
                <button
                  type="button"
                  onClick={() => setFocusMode && setFocusMode(prev => !prev)}
                  className={`px-3 py-1.5 text-xs font-mono font-bold rounded-lg border transition-all flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-seal ${
                    isFocusActive
                      ? "bg-seal text-paper border-seal shadow-md hover:bg-seal/90"
                      : "bg-paper-deep/30 hover:bg-paper-deep/60 text-ink border-blossom/40 hover:border-seal/60"
                  }`}
                  aria-label={isFocusActive ? "Exit focus mode (Esc)" : "Enter focus mode (F)"}
                  aria-pressed={Boolean(isFocusActive)}
                  title={isFocusActive ? "Exit focus mode (Esc or F)" : "Enter focus mode (F when editor not focused)"}
                >
                  <span aria-hidden="true">{isFocusActive ? "✕" : "⛶"}</span>
                  <span>{isFocusActive ? "Exit Focus" : "Focus"}</span>
                  <kbd className={`text-[10px] px-1 py-0.2 rounded font-mono ${isFocusActive ? "bg-black/20 text-paper" : "bg-black/5 dark:bg-white/10 text-ink-soft"}`}>
                    {isFocusActive ? "Esc" : "F"}
                  </kbd>
                </button>
                {!isFocusActive && (
                  <InkButton variant="secondary" className="self-start sm:self-center flex-none" onClick={() => onNavigate("/")}>
                    ← Return to Roster
                  </InkButton>
                )}
              </div>
            </div>
          </Reveal>

          <ErrorBanner message={error} onDismiss={() => setError(null)} />

          {/* Workbench Resizable Split Container */}
          <div ref={splitContainerRef} className={`split-container flex-col md:flex-row gap-0 ${isFocusActive ? "focus-workbench" : ""}`}>

            {/* RIGHT PANE: Code Editor on Top, Results Panel Below */}
            <div
              className="w-full md:overflow-y-auto min-w-0 flex flex-col gap-3"
              style={{
                width: "100%",
                flex: "1 1 auto",
              }}
            >
              {/* TOP: Code Editor Window */}
              <Reveal delay={60} className={isFocusActive ? "focus-editor-card" : ""}>
                <PaperCard className={`code-window flex flex-col ${isFocusActive ? "h-full" : ""}`} pad="p-0">
                  <div className="code-window-bar flex-none">
                    <div className="flex items-center gap-3">
                      <span className="traffic" aria-hidden="true"><i></i><i></i><i></i></span>
                      <span className="text-xs font-mono font-semibold text-ink">solution.py</span>
                      <span className="text-[11px] text-ink-soft font-mono">(Python 3)</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        type="button"
                        onClick={applyBuggyPreset}
                        className="text-xs font-mono text-ink-soft hover:text-ink underline"
                        title="Load intentional unhandled_short_input bug"
                      >
                        Preset Buggy Code
                      </button>
                      <span className="text-ink-soft">|</span>
                      <button
                        type="button"
                        onClick={applyPassingPreset}
                        className="text-xs font-mono text-pine hover:underline font-semibold"
                        title="Load clean passing solution"
                      >
                        Preset Correct Code
                      </button>
                    </div>
                  </div>

                  {/* CodeMirror 5 with fallback */}
                  <div className={isFocusActive ? "flex-1 min-h-0 overflow-hidden" : ""}>
                    <CodeMirrorEditor
                      value={code}
                      onChange={setCode}
                      onRun={handleRun}
                      onSubmit={handleSubmit}
                      onEsc={() => isFocusActive && setFocusMode && setFocusMode(false)}
                      refreshKey={`${isFocusActive}-${descCollapsed}`}
                    />
                  </div>

                  {/* Editor Action Bar */}
                  <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 px-4 py-2.5 border-t border-blossom/30 bg-paper-deep/20 flex-none">
                    <div className="flex items-center gap-2">
                      <span className="text-[11px] font-mono text-ink-soft hidden sm:inline">
                        <kbd className="px-1.5 py-0.5 rounded bg-black/5 dark:bg-white/10 font-bold">Ctrl+Enter</kbd> Run
                        <span className="mx-1.5">•</span>
                        <kbd className="px-1.5 py-0.5 rounded bg-black/5 dark:bg-white/10 font-bold">Ctrl+Shift+Enter</kbd> Submit
                      </span>
                    </div>

                    <div className="flex items-center gap-2 self-end sm:self-center">
                      <InkButton
                        variant="secondary"
                        onClick={handleRun}
                        disabled={running || submitting}
                        className="!py-2 text-xs"
                      >
                        {running ? "Running Visible..." : "▶ Run Visible"}
                      </InkButton>
                      <InkButton
                        variant="primary"
                        onClick={handleSubmit}
                        disabled={running || submitting}
                        className="!py-2 text-xs"
                      >
                        {submitting ? "Evaluating Kata..." : "Execute & Submit →"}
                      </InkButton>
                    </div>
                  </div>
                </PaperCard>
              </Reveal>

              {/* BOTTOM: Results Panel */}
              <Reveal delay={120} className={isFocusActive ? "focus-results-card" : ""}>
                <PaperCard pad="p-4 md:p-5" className={isFocusActive ? "h-full flex flex-col overflow-y-auto" : ""}>
                  <div className="flex items-center justify-between gap-3 mb-3 pb-2.5 border-b border-blossom/30">
                    <h3 className="font-serif text-lg font-bold text-ink">Workbench Results</h3>
                    {lastAction === "submit" && submitResult && (
                      submitResult.all_passed ? (
                        <span className="text-xs font-mono font-bold text-pine flex items-center gap-1.5">
                          <Seal char="完" size="sm" animated /> All Tests Conquered
                        </span>
                      ) : (
                        <span className="text-xs font-mono font-bold text-seal flex items-center gap-1.5">
                          <Seal char="修" size="sm" animated /> Needs Refinement
                        </span>
                      )
                    )}
                    {lastAction === "run" && runResult && (
                      <span className="text-xs font-mono text-ink-soft">Visible Bench Only (Draft)</span>
                    )}
                  </div>

                  <LiveHintsPanel live={liveHints} codeIsBlank={!code.trim()} />

                  {!lastAction ? (
                    <div className="py-8 text-center text-ink-soft font-mono text-xs space-y-2">
                      <div>Ready to evaluate your code.</div>
                      <div className="text-[11px] opacity-75">
                        Click <strong>Run Visible</strong> to test example cases, or <strong>Execute & Submit</strong> for full evaluation.
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-4 page-enter">
                      {/* Submit-specific master evaluation summaries */}
                      {lastAction === "submit" && submitResult && (
                        <>
                          {/* Dojo Master Explanation */}
                          <div className="dojo-inset p-3 text-xs md:text-sm">
                            <div className="eyebrow !text-ink-soft mb-1">Dojo Master Observation</div>
                            <p className="text-ink leading-relaxed">{submitResult.explanation}</p>
                          </div>

                          {/* Mistake Tags */}
                          {submitResult.mistake_tags && submitResult.mistake_tags.length > 0 && (
                            <div className="flex items-center flex-wrap gap-1.5">
                              <span className="eyebrow mr-1">Diagnosed Mistake DNA:</span>
                              {submitResult.mistake_tags.map(t => (
                                <span key={t} className="pill pill-seal font-semibold text-xs">#{t}</span>
                              ))}
                            </div>
                          )}

                          {/* Prediction Result (when present) */}
                          {submitResult.prediction_result && (
                            <div className="dojo-inset p-3 text-xs space-y-1">
                              <div className="flex items-center justify-between">
                                <span className="eyebrow !text-ink-soft">Prediction Reflection</span>
                                <span className={`pill ${submitResult.prediction_result.correct ? "pill-pine" : "pill-ochre"}`}>
                                  {submitResult.prediction_result.correct ? "✓ Accurate Prediction" : "✗ Prediction Missed"}
                                </span>
                              </div>
                              <div className="flex gap-4 font-mono text-xs text-ink-soft">
                                <span>Predicted: <strong className="text-ink">{submitResult.prediction_result.predicted}</strong></span>
                                <span>Actual: <strong className="text-ink">{submitResult.prediction_result.actual}</strong></span>
                              </div>
                            </div>
                          )}

                          {/* Bug Arena (when present) */}
                          {submitResult.arena && (
                            <div className="dojo-inset p-3 text-xs space-y-2">
                              <div className="eyebrow !text-ink-soft">Bug Arena Progress</div>
                              <div className="flex flex-wrap gap-2">
                                {submitResult.arena.defeated && submitResult.arena.defeated.map((d, i) => (
                                  <span key={i} className="pill pill-pine text-[11px] font-mono">✓ {d}</span>
                                ))}
                                {submitResult.arena.remaining && submitResult.arena.remaining.map((r, i) => (
                                  <span key={i} className="pill text-[11px] font-mono opacity-60">⏳ {r}</span>
                                ))}
                              </div>
                            </div>
                          )}
                        </>
                      )}

                      {/* Tabbed Test Cases Bar */}
                      <div>
                        <div className="flex items-center gap-1.5 overflow-x-auto pb-1 mb-3 border-b border-blossom/20">
                          {activeVisibleTests.map((vt, idx) => {
                            const isPass = vt.outcome === "passed";
                            const dotColor = isPass ? "bg-pine" : vt.outcome === "wrong_output" ? "bg-ochre" : "bg-seal";
                            const isSelected = activeCaseTab === idx;
                            return (
                              <button
                                key={vt.test || idx}
                                type="button"
                                onClick={() => setActiveCaseTab(idx)}
                                className={`px-2.5 py-1 text-xs font-mono rounded flex items-center gap-1.5 transition-colors flex-none ${
                                  isSelected
                                    ? "bg-seal/15 text-seal font-bold border-b-2 border-seal shadow-xs"
                                    : "text-ink-soft hover:text-ink hover:bg-black/5 dark:hover:bg-white/5"
                                }`}
                              >
                                <span className={`w-1.5 h-1.5 rounded-full ${dotColor}`}></span>
                                <span>Case {idx + 1}</span>
                              </button>
                            );
                          })}

                          {/* Dedicated Hidden Tests Tab (Submit only) */}
                          {lastAction === "submit" && submitResult && submitResult.hidden && submitResult.hidden.length > 0 && (
                            <button
                              type="button"
                              onClick={() => setActiveCaseTab("hidden")}
                              className={`px-2.5 py-1 text-xs font-mono rounded flex items-center gap-1.5 transition-colors flex-none ${
                                activeCaseTab === "hidden"
                                  ? "bg-seal/15 text-seal font-bold border-b-2 border-seal shadow-xs"
                                  : "text-ink-soft hover:text-ink hover:bg-black/5 dark:hover:bg-white/5"
                              }`}
                            >
                              <span className={`w-1.5 h-1.5 rounded-full ${
                                submitResult.hidden.every(h => h.outcome === "passed") ? "bg-pine" : "bg-seal"
                              }`}></span>
                              <span>Hidden ({submitResult.hidden.length})</span>
                            </button>
                          )}
                        </div>

                        {/* Selected Tab Content: Visible Test Details */}
                        {typeof activeCaseTab === "number" && currentCase && (
                          <div className="space-y-2.5 text-xs font-mono page-enter">
                            <div className="flex items-center justify-between">
                              <span className="eyebrow !text-ink-soft">Test Case #{activeCaseTab + 1}</span>
                              <OutcomeBadge outcome={currentCase.outcome} limit={currentCase.limit} />
                            </div>

                            <div>
                              <div className="text-[11px] text-ink-soft mb-1 font-mono">Invocation:</div>
                              <pre className="dojo-inset p-2.5 text-xs text-ink overflow-x-auto"><code>{currentCase.call}</code></pre>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                              <div>
                                <div className="text-[11px] text-ink-soft mb-1 font-mono">Expected Output:</div>
                                <pre className="dojo-inset p-2.5 text-xs text-pine font-semibold overflow-x-auto"><code>{currentCase.expected}</code></pre>
                              </div>
                              <div>
                                <div className="text-[11px] text-ink-soft mb-1 font-mono">Actual Output (Got):</div>
                                <pre className="dojo-inset p-2.5 text-xs text-ink overflow-x-auto"><code>{currentCase.got !== null && currentCase.got !== undefined ? String(currentCase.got) : "None"}</code></pre>
                              </div>
                            </div>

                            {currentCase.error && (
                              <div className="text-seal text-xs font-mono mt-1">Error: {currentCase.error}</div>
                            )}
                          </div>
                        )}

                        {/* Selected Tab Content: Hidden Tests Tab */}
                        {/* HARD ANTI-LEAK SECURITY RULE: Hidden tests show ONLY "Hidden #n" and the outcome badge. NEVER render any other hidden data. */}
                        {activeCaseTab === "hidden" && lastAction === "submit" && submitResult && (
                          <div className="space-y-3 page-enter">
                            <div className="flex items-center justify-between">
                              <span className="eyebrow !text-ink-soft">Hidden Tests Integrity</span>
                              <span className="text-[11px] font-mono text-ink-soft">Strictly Redacted Bench</span>
                            </div>
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                              {submitResult.hidden.map((h) => (
                                <div key={h.test} className="dojo-inset px-3 py-2 text-xs font-mono flex flex-col gap-1.5">
                                  <span className="text-ink-soft font-semibold">Hidden #{h.test}</span>
                                  <OutcomeBadge outcome={h.outcome} limit={h.limit} />
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </PaperCard>
              </Reveal>
            </div>

          </div>
        </div>
      );
    }

    // 4. Progress Page (Route: /progress)
    function ProgressPage({ onNavigate }) {
      const { learnerId } = useContext(DojoContext);
      const [learner, setLearner] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [reload, setReload] = useState(0);

      useEffect(() => {
        let alive = true;
        async function load() {
          setLoading(true);
          setError(null);
          try {
            const data = await api.getLearner(learnerId);
            if (alive) setLearner(data);
          } catch (e) {
            if (alive) setError(e);
          } finally {
            if (alive) setLoading(false);
          }
        }
        load();
        return () => { alive = false; };
      }, [learnerId, reload]);

      if (loading) return <Loader label="Compiling progress scrolls..." />;
      if (error || !learner) return <LoadError error={error} onNavigate={onNavigate} onRetry={() => setReload((n) => n + 1)} />;

      const bugDna = learner.bug_dna || [];
      const maxDna = Math.max(1, ...bugDna.map((b) => b.count));
      const dnaColors = ["rgb(var(--seal-rgb))", "rgb(var(--ochre-rgb))", "rgb(var(--indigo-rgb))", "rgb(var(--pine-rgb))"];

      return (
        <div className="space-y-8">
          <Reveal>
            <RuleHeading
              title="Progress & Mastery"
              subtitle="Deep inspection of conceptual strengths, recurring mistake DNA, and earned seals."
            />
          </Reveal>

          {/* Mastery grid */}
          <Reveal delay={60}>
            <PaperCard className="space-y-4" pad="p-6 md:p-8">
              <div>
                <h3 className="font-serif text-xl md:text-2xl font-bold text-ink">Conceptual Mastery Grid</h3>
                <p className="text-xs font-mono text-ink-soft mt-1">
                  Derived from independent pass rates across diverse test suites.
                </p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                {Object.entries(learner.mastery).map(([concept, rate], i) => (
                  <div key={concept} className="dojo-inset p-4 flex flex-col gap-2.5">
                    <div className="flex justify-between items-center text-xs font-mono">
                      <span className="uppercase font-semibold text-ink tracking-wide">{concept}</span>
                      <span className="font-bold text-ink">{Math.round(rate * 100)}%</span>
                    </div>
                    <div className="meter" role="progressbar" aria-valuenow={Math.round(rate * 100)} aria-valuemin={0} aria-valuemax={100} aria-label={`${concept} mastery`}>
                      <span
                        style={{
                          width: `${rate * 100}%`,
                          animationDelay: `${i * 80}ms`,
                          background: rate >= 0.7
                            ? "linear-gradient(90deg, rgb(var(--pine-rgb) / .75), rgb(var(--pine-rgb)))"
                            : rate >= 0.5
                            ? "linear-gradient(90deg, rgb(var(--ochre-rgb) / .75), rgb(var(--ochre-rgb)))"
                            : "linear-gradient(90deg, rgb(var(--blossom-rgb)), rgb(var(--seal-rgb)))",
                        }}
                      ></span>
                    </div>
                  </div>
                ))}
              </div>
            </PaperCard>
          </Reveal>

          {/* Bug DNA frequency */}
          {bugDna.length > 0 && (
            <Reveal delay={120}>
              <PaperCard pad="p-6 md:p-8">
                <h3 className="font-serif text-xl md:text-2xl font-bold text-ink">Your Bug DNA</h3>
                <p className="text-xs font-mono text-ink-soft mt-1 mb-5">Cognitive error frequency across your submissions.</p>
                <div className="space-y-3.5">
                  {bugDna.map((b, i) => (
                    <div key={b.tag} className="grid grid-cols-[minmax(0,9.5rem)_1fr_2rem] sm:grid-cols-[13rem_1fr_2.5rem] items-center gap-3 text-xs font-mono">
                      <span className="truncate text-ink font-semibold" title={`#${b.tag}`}>#{b.tag}</span>
                      <div className="meter" aria-hidden="true">
                        <span style={{ width: `${(b.count / maxDna) * 100}%`, background: dnaColors[i % dnaColors.length], animationDelay: `${i * 100}ms` }}></span>
                      </div>
                      <span className="text-right text-ink-soft">{b.count}×</span>
                    </div>
                  ))}
                </div>
              </PaperCard>
            </Reveal>
          )}

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {/* Recurring Mistake DNA */}
            <Reveal delay={180} className="h-full">
              <PaperCard className="h-full">
                <h3 className="font-serif text-xl font-bold text-ink mb-1">Recurring Mistake DNA</h3>
                <p className="text-xs text-ink-soft font-mono mb-4">
                  Patterns identified across multiple kata submissions.
                </p>

                <div className="space-y-3">
                  {learner.recurring_mistakes.map((rm) => (
                    <div key={rm.tag} className="dojo-inset p-4">
                      <div className="flex items-center justify-between gap-2 mb-1.5 flex-wrap">
                        <span className="pill pill-seal font-bold">#{rm.tag}</span>
                        <span className="text-xs font-mono text-ink-soft">Seen in {rm.count} Katas</span>
                      </div>
                      <p className="text-sm text-ink">{rm.description}</p>
                      <div className="mt-2 text-[11px] font-mono text-ink-soft">
                        Occurred in: {rm.challenges.join(", ")}
                      </div>
                    </div>
                  ))}
                </div>
              </PaperCard>
            </Reveal>

            {/* Earned Seals & Achievements */}
            <Reveal delay={240} className="h-full">
              <PaperCard className="h-full">
                <h3 className="font-serif text-xl font-bold text-ink mb-1">Dojo Seals Awarded</h3>
                <p className="text-xs text-ink-soft font-mono mb-4">
                  Tokens of discipline and bug eradication.
                </p>

                <div className="flex flex-wrap gap-4">
                  {learner.achievements.map((ach) => (
                    <div key={ach} className="dojo-inset p-3 pr-5 flex items-center gap-3">
                      <Seal char="印" size="md" />
                      <div>
                        <div className="font-serif text-sm font-bold text-ink">{ach}</div>
                        <div className="text-[11px] font-mono text-pine font-medium">Verified</div>
                      </div>
                    </div>
                  ))}
                </div>
              </PaperCard>
            </Reveal>
          </div>
        </div>
      );
    }

    // 5. History Page (Route: /history)
    function HistoryPage({ onNavigate }) {
      const { learnerId } = useContext(DojoContext);
      const [historyItems, setHistoryItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [reload, setReload] = useState(0);

      useEffect(() => {
        let alive = true;
        async function load() {
          setLoading(true);
          setError(null);
          try {
            const data = await api.history(learnerId);
            if (alive) setHistoryItems(Array.isArray(data) ? data : []);
          } catch (e) {
            if (alive) setError(e);
          } finally {
            if (alive) setLoading(false);
          }
        }
        load();
        return () => { alive = false; };
      }, [learnerId, reload]);

      if (loading) return <Loader label="Reviewing past kata logs..." />;
      if (error) return <LoadError error={error} onNavigate={onNavigate} onRetry={() => setReload((n) => n + 1)} />;

      return (
        <div className="space-y-8">
          <Reveal>
            <RuleHeading
              title="Attempt History"
              subtitle="Chronicle of every evaluation, tests satisfied, and mistake tags detected."
            />
          </Reveal>

          <div className="space-y-3">
            {historyItems.map((item, i) => (
              <Reveal key={item.submission_id} delay={i * 70}>
                <PaperCard pad="p-4 md:p-5" className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div className="flex items-start gap-4 min-w-0">
                    <Seal char={item.all_passed ? "完" : "試"} size="md" />
                    <div className="min-w-0">
                      <div className="flex items-center gap-x-3 gap-y-0.5 flex-wrap">
                        <span className="font-serif text-lg font-bold text-ink break-all">{item.challenge_id}</span>
                        <span className="text-xs font-mono text-ink-soft">{item.created_at}</span>
                      </div>
                      <div className="flex items-center gap-2 mt-1 text-xs font-mono flex-wrap">
                        <span className="text-pine font-medium">{item.passed_count} passed</span>
                        <span className="text-ink-soft">/</span>
                        <span className={item.failed_count > 0 ? "text-seal font-medium" : "text-ink-soft"}>
                          {item.failed_count} failed
                        </span>
                        <span className="text-ink-soft">• Hints used: {item.hints_used}</span>
                      </div>
                    </div>
                  </div>

                  <div className="flex items-center gap-3 flex-wrap">
                    {item.mistake_tags.map(t => (
                      <span key={t} className="pill pill-seal">#{t}</span>
                    ))}
                    <InkButton variant="secondary" onClick={() => onNavigate(`/challenge/${item.challenge_id}`)}>
                      Review
                    </InkButton>
                  </div>
                </PaperCard>
              </Reveal>
            ))}
          </div>
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      // Routing state (routes: / (Dashboard), /welcome, /challenge/:id, /progress, /history)
      const [currentRoute, setCurrentRoute] = useState("/");
      // Night theme toggle state in memory (React state only)
      const [isDark, setIsDark] = useState(false);
      // Learner identity in React state
      const [session, setSessionState] = useState(Session.current);
      const [learnerId, setLearnerId] = useState(Session.current ? Session.current.learnerId : DEFAULT_LEARNER);
      // Ambience (petal count / wind speed / cursor petals), remembered per browser
      const [ambience, setAmbienceState] = useState(() => {
        try {
          const v = JSON.parse(localStorage.getItem(AMBIENCE_KEY) || "null");
          return v ? { ...AMBIENCE_DEFAULT, ...v } : AMBIENCE_DEFAULT;
        } catch (e) { return AMBIENCE_DEFAULT; }
      });
      const setAmbience = (next) => {
        setAmbienceState(next);
        try { localStorage.setItem(AMBIENCE_KEY, JSON.stringify(next)); } catch (e) {}
      };
      // Petal-wipe page transition animation active state
      const [wiping, setWiping] = useState(false);

      // Focus Mode State with localStorage persistence
      const [focusMode, setFocusMode] = useState(() => {
        try {
          return localStorage.getItem("debugdojo_focus_mode") === "true";
        } catch (e) {
          return false;
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem("debugdojo_focus_mode", String(focusMode));
        } catch (e) {}
      }, [focusMode]);

      // Focus mode is active when on a challenge workbench and focusMode is enabled
      const isWorkbench = currentRoute.startsWith("/challenge");
      const isFocusActive = isWorkbench && focusMode;

      const prefersReducedMotion = useMemo(() => {
        return typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      }, []);

      // Handle Page Navigation with a petal-wipe transition (pink sweep, ~380ms)
      const handleNavigate = (route) => {
        if (route === currentRoute) return;
        if (prefersReducedMotion) {
          setCurrentRoute(route);
          window.scrollTo({ top: 0 });
          return;
        }
        setWiping(true);
        setTimeout(() => {
          setCurrentRoute(route);
          window.scrollTo({ top: 0 });
        }, 175);
        setTimeout(() => {
          setWiping(false);
        }, 390);
      };

      const toggleTheme = () => {
        setIsDark(prev => !prev);
      };

      const signIn = (s) => { Session.save(s); setSessionState(s); setLearnerId(s.learnerId); };
      const signOut = () => {
        Session.clear();
        setSessionState(null);
        setLearnerId(DEFAULT_LEARNER);
        handleNavigate("/welcome");
      };

      useScrollEffects();
      useMouseEffects(!isFocusActive && !prefersReducedMotion);

      // Apply dark class to the document root
      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      }, [isDark]);

      // Route Dispatcher
      const renderCurrentRoute = () => {
        if (currentRoute === "/") {
          return <DashboardPage onNavigate={handleNavigate} />;
        }
        if (currentRoute === "/welcome") {
          return <WelcomePage onNavigate={handleNavigate} />;
        }
        if (currentRoute.startsWith("/challenge")) {
          const parts = currentRoute.split("/");
          const challengeId = parts[2] || "last-k-total";
          return <ChallengePage challengeId={challengeId} onNavigate={handleNavigate} />;
        }
        if (currentRoute === "/progress") {
          return <ProgressPage onNavigate={handleNavigate} />;
        }
        if (currentRoute === "/history") {
          return <HistoryPage onNavigate={handleNavigate} />;
        }
        return <DashboardPage onNavigate={handleNavigate} />;
      };

      return (
        <DojoContext.Provider value={{ learnerId, setLearnerId, focusMode, setFocusMode, isFocusActive, session, signIn, signOut, ambience, setAmbience }}>
          <div className={`min-h-screen text-ink ${isFocusActive ? "focus-viewport" : ""}`}>
            <IntroSplash />
            <ScrollProgress />
            <CursorPetals enabled={ambience.trail && !isFocusActive && !prefersReducedMotion} />
            <TeamCredit />

            {/* Page-transition overlay */}
            {wiping && !isFocusActive && <div className="petal-wipe" />}

            {/* Atmosphere: blossoming branches + drifting petals (decorative, behind content) */}
            {!isFocusActive && (
              <>
                <div className="branch-layer branch-right" aria-hidden="true"><div><SakuraBranch seed={11} idp="brR" /></div></div>
                <div className="branch-layer branch-left" aria-hidden="true"><div><SakuraBranch seed={23} idp="brL" /></div></div>
                <PetalLayer density={ambience.density} speed={ambience.speed} />
              </>
            )}

            <div className={`relative z-10 ${isFocusActive ? "h-full flex flex-col" : ""}`}>
              {!isFocusActive && <NavigationRail currentRoute={currentRoute} onNavigate={handleNavigate} />}
              {!isFocusActive && <AppHeader isDark={isDark} onToggleTheme={toggleTheme} onNavigate={handleNavigate} />}

              <main className={
                isFocusActive
                  ? "w-full h-screen p-2 md:p-3 flex flex-col overflow-hidden m-0 max-w-none"
                  : "max-w-[72rem] mx-auto px-5 md:pl-28 md:pr-8 pt-8 md:pt-10 min-h-[calc(100vh-4rem)]"
              }>
                {/* key => each route enters with a soft rise-in and fresh state */}
                <div key={currentRoute} className={`page-enter ${isFocusActive ? "h-full flex-1 flex flex-col min-h-0" : ""}`}>
                  {renderCurrentRoute()}
                </div>
              </main>

              {!isFocusActive && (
                <>
                  <ToriiScene />
                  <footer className="text-center text-xs font-mono py-6 pb-28 md:pb-8" style={{ background: "var(--hill)", color: "rgb(255 240 244 / .75)" }}>
                    Debug Dojo · 道場 · find the bug, keep the answer
                  </footer>
                </>
              )}
            </div>
          </div>
        </DojoContext.Provider>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
